# Directories of the AOSP tree Soong must not see.
# Soong analyses every module of every fetched project, and in a subset tree some module types panic on a missing dependency instead of naming it;
# when such a module is one ATL never builds, its directory is pruned here rather than the tree grown or Soong patched.
# `xtask soong` puts Soong's own marker `.find-ignore` in each directory before a build (the finder skips it and everything below) and removes markers whose row is gone.
# `xtask soong --fetch-missing` prints candidates; a person adds the row, since a directory may also hold a module a goal needs (the build then fails naming it).
#
# Row key: tree path of the directory, inside a pinned AOSP project (checked; the directory must exist when xtask soong runs).
#   reason   why ATL needs no module below it
# Rows are added when a build first trips over them.

["build/make/target/product/generic"]
reason = "generic system image modules (android_system_image); ATL builds libraries, never device images"

["packages/services/Car/packages"]
reason = "car apps; the Car project is pinned only for the team modules frameworks/hardware/interfaces tests name"

["packages/modules/Virtualization/build/microdroid"]
reason = "Microdroid VM images (android_filesystem); framework-minus-apex needs only Virtualization's framework stubs"

["packages/modules/Virtualization/guest"]
reason = "guest VM payloads and Trusty test VM images; framework-minus-apex needs only Virtualization's framework stubs"

["packages/modules/Virtualization/tests"]
reason = "AVF test VM images and test apps; framework-minus-apex needs only Virtualization's framework stubs"
