# Directories of the AOSP tree the converter must not scan.
# bp2ninja parses every Android.bp of the tree, and in a subset tree some module types fail on a missing dependency instead of naming it;
# when such a module is one ATL never builds, its directory is pruned here rather than the tree grown or the converter patched.
# `xtask native` puts the marker `.find-ignore` in each directory before every round (bp2ninja and Soong's finder skip it and everything below) and removes markers whose row is gone.
# A person adds the row: a directory may also hold a module a goal needs, and the build then fails naming it.
#
# Row key: tree path of the directory, inside a pinned AOSP project (`xtask check` tables step checks it; the directory must exist when xtask native runs).
#   reason   why ATL needs no module below it
# Rows are added when a build first trips over them.

["build/make/target/product/generic"]
reason = "generic system image modules (android_system_image); ATL builds libraries, never device images"

["packages/modules/Virtualization/build/microdroid"]
reason = "Microdroid VM images (android_filesystem); framework-minus-apex needs only Virtualization's framework stubs"
