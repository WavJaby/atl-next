# SPDX-License-Identifier: MIT
# What must be installed outside the repo, and who needs it. Checked by `cargo xtask check` (schema,
# references) and `cargo xtask deps --check` (this host). Tools that rewrite this file keep comments and
# order (toml_edit).
#
# Row key: logical name. A row has exactly one source:
#   distro  debian, arch        package name per distro (Arch: x86_64 only); absent = not packaged there
#   cargo   cargo, version      crate installed with `cargo install --locked`, exact version
#   rustup  rustup_target       std of another rustc target for the rust-toolchain.toml toolchain (`rustup target add`)
#   aosp    aosp                tree path of a [aosp.projects] entry in sources.toml: the pinned copy in src/aosp
#   sysroot sysroot_debs        Debian packages pinned by exact `name=version`, fetched without root (`xtask deps --fetch`) and unpacked into cache/sysroot/<row>/root; `--check` compares each pin's SHA256 with the apt index
# Fields:
#   binary        executable xtask runs: a bare name on PATH (distro), a path inside the project (aosp, optional)
#   version_arg   argument that prints the version (default `--version`; go: `version`)
#   pkgconfig     libraries only: pkg-config module; its version is checked through it
#   min, min_reason
#                 distro row with binary: the binary's reported version (first dotted number of
#                 `<binary> <version_arg>`) must be >= min. Other distro rows: pkg-config or package version.
#                 aosp rows take no min: the pin is the version. A min without an upstream requirement records
#                 the version observed on 2026-11-07 (min_reason says so): older is untested.
# Every row:
#   scope    build | runtime | test (static checks count as test)
#   used_by  typed references, each checked to exist: crate:<workspace crate>,
#            upstream:<sources.toml name or aosp>, xtask:<subcommand>
# Not here: Rust itself (rust-toolchain.toml via rustup, the one prerequisite xtask cannot check); Gradle,
# the Android SDK and apkeep (no repo consumer: the test APKs are pinned in test-apks.toml and downloaded with curl).
# Rows are added when a consumer first needs them.

[bison]
debian = "bison"
arch = "bison"
binary = "bison"
min = "3.8.2"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native"]

# the broker's sandbox (plan Q5, M2 depth Q4(a)); `xtask test binder` runs servicemanager in a mount namespace whose /system and /vendor hold the test layout (empty VINTF manifests)
[bubblewrap]
debian = "bubblewrap"
arch = "bubblewrap"
binary = "bwrap"
min = "0.12.0"
min_reason = "observed 2026-11-07; older is untested"
scope = ["runtime", "test"]
used_by = ["crate:atl-broker", "xtask:test"]

# builds providers.toml `crate:` providers as C shared libraries, with their headers
[cargo-c]
cargo = "cargo-c"
version = "0.10.26"
scope = ["build"]
used_by = ["xtask:native"]

[cargo-deny]
cargo = "cargo-deny"
version = "0.20.2"
scope = ["test"]
used_by = ["xtask:check"]

# the distro C/C++ toolchain of the converter route (plan D7-2): clang, lld, llvm-ar, libc++
[clang]
debian = "clang-19"
arch = "clang"
binary = "clang-19"
min = "19.1.7"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native", "upstream:qemu", "xtask:cross"]

# the C++ driver: native's --cxx default and the libc++ gate (libcxx_gate.rs); same package as `clang`
[clang-cxx]
debian = "clang-19"
arch = "clang"
binary = "clang++-19"
min = "19.1.7"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native", "xtask:check"]

# CMake is the build system of upstream BoringSSL, the LLVM runtimes (runtimes.rs) and the host LLVM (llvm_host.rs): their only supported build (CLAUDE.md). BoringSSL's CMakeLists.txt needs 3.22
[cmake]
debian = "cmake"
arch = "cmake"
binary = "cmake"
min = "3.22"
min_reason = "BoringSSL CMakeLists.txt: cmake_minimum_required(VERSION 3.22)"
scope = ["build"]
used_by = ["upstream:boringssl"]

# downloads the test APKs of test-apks.toml (`xtask fetch --test-apks`, `xtask run-apk`): HTTPS, redirects followed, file size capped
[curl]
debian = "curl"
arch = "curl"
binary = "curl"
min = "8.14.1"
min_reason = "observed 2026-11-06; older is untested"
scope = ["test"]
used_by = ["xtask:fetch", "xtask:run-apk"]

# the Java pipeline's d8: a bash script that runs r8.jar with `java` on PATH, so it runs with the `jdk` row's JDK first on PATH (atld_run.rs)
[d8]
aosp = "prebuilts/r8"
binary = "d8"
scope = ["build"]
used_by = ["xtask:native", "xtask:run-apk"]

[flex]
debian = "flex"
arch = "flex"
binary = "flex"
min = "2.6.4"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native"]

# build_pool.rs test: a killed holder frees its token, the holder being flock(1)
[flock]
debian = "util-linux"
arch = "util-linux"
binary = "flock"
min = "2.41.5"
min_reason = "observed 2026-11-07; older is untested"
scope = ["test"]
used_by = ["xtask:check"]

# Mesa's GBM: the gralloc allocator service creates linear dma-bufs through libgbm on the host's DRM device (the gbm crate links it); the dev package carries gbm.pc and the lib link name. Arch ships libgbm in mesa.
[gbm]
debian = "libgbm-dev"
arch = "mesa"
pkgconfig = "gbm"
scope = ["build", "runtime"]
used_by = ["crate:atl-gralloc-service"]

# QEMU's GLib (meson.build:1058 glib_req_ver); gmodule, which its TCG plugins load, ships in the same package
[glib]
debian = "libglib2.0-dev"
arch = "glib2"
pkgconfig = "glib-2.0"
min = "2.66.0"
min_reason = "QEMU meson.build:1058 glib_req_ver >=2.66.0"
scope = ["build"]
used_by = ["upstream:qemu"]

[git]
debian = "git"
arch = "git"
binary = "git"
min = "2.47.3"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build", "test"]
used_by = ["xtask:aosp", "xtask:check", "xtask:fetch", "xtask:patch"]


# Go builds the converter (tools/bp2ninja), the one Go program allowed (CLAUDE.md); gofmt is the same package's and runs beside go (converter.rs)
[go]
debian = "golang-1.24-go"
arch = "go"
binary = "go"
version_arg = "version"
min = "1.24.4"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native"]

# the platform layer's window toolkit (M3 slice 6): the gtk4 crate's build scripts resolve it through pkg-config and the app process links it; the cargo feature `v4_14` fixes the minimum
[gtk4]
debian = "libgtk-4-dev"
arch = "gtk4"
pkgconfig = "gtk4"
min = "4.14"
min_reason = "workspace Cargo.toml gtk4 feature v4_14: GDK_MEMORY_R8G8B8X8 and the other X8 formats, which opaque layers are uploaded as"
scope = ["build", "runtime"]
used_by = ["crate:atl-platform-ui-linux"]

# the one JDK: AOSP's prebuilt JDK 21 (pinned). Used by the converter's host Java tools, the test pipeline's javac and jar, and d8 (run-apk). The per-OS subdirectory comes from arches.toml `soong_prebuilt_os`.
[jdk]
aosp = "prebuilts/jdk/jdk21"
scope = ["build"]
used_by = ["xtask:native", "xtask:run-apk"]

# xtask native: rust_bindgen's bindgen loads the libclang of the `clang` row's clang (libclang_dir)
[libclang]
debian = "libclang-19-dev"
# Arch's clang package ships libclang
arch = "clang"
scope = ["build"]
used_by = ["crate:atl-binder-wire", "crate:atl-bionic", "crate:atl-bridgegen", "xtask:native"]

# AOSP's C++ assumes libc++ (libstdc++ 14 rejects libbase); the distro's, matching its clang.
# atl-bionic's build parses bionic's C++ prop-area sources against its headers (bionic ships no C++ library).
[libcxx]
debian = "libc++-19-dev"
arch = "libc++"
scope = ["build"]
used_by = ["crate:atl-bionic", "xtask:native"]

[libcxxabi]
debian = "libc++abi-19-dev"
arch = "libc++abi"
scope = ["build"]
used_by = ["xtask:native"]

# elfutils' libelf built for glibc: AOSP's copy is configured for bionic (providers.toml `libelf`)
[libelf]
debian = "libelf-dev"
arch = "libelf"
pkgconfig = "libelf"
scope = ["build", "runtime"]
used_by = ["upstream:aosp"]

# the converter's linker: Soong's commonGlobalLldflags -fuse-ld=lld, which the `clang` row's clang resolves to its own ld.lld
[lld]
debian = "lld-19"
arch = "lld"
binary = "ld.lld"
min = "19.1.7"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native", "xtask:cross"]

# the archiver (native --ar default; the converter's ninja rules run it)
[llvm]
debian = "llvm-19"
arch = "llvm"
binary = "llvm-ar-19"
min = "19.1.7"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native"]

# the host intel_clc (intel_clc.rs, build-time only, never in an app process): Mesa finds LLVM through llvm-config, links the shared libLLVM, libclang-cpp and the SPIR-V translator, and reads libclc's spirv64 bitcode
[llvm-dev]
debian = "llvm-19-dev"
arch = "llvm"
binary = "llvm-config-19"
min = "19.1.7"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native"]

[libclang-cpp]
debian = "libclang-cpp19-dev"
arch = "clang"
scope = ["build"]
used_by = ["xtask:native"]

[llvm-spirv-lib]
debian = "libllvmspirvlib-19-dev"
arch = "spirv-llvm-translator"
pkgconfig = "LLVMSPIRVLib"
min = "19.1.0"
min_reason = "observed 2026-11-08; Mesa needs the translator of the same LLVM major as llvm-config"
scope = ["build"]
used_by = ["xtask:native"]

[libclc]
debian = "libclc-19-dev"
arch = "libclc"
pkgconfig = "libclc"
min = "0.2.0"
min_reason = "observed 2026-11-08; older is untested"
scope = ["build"]
used_by = ["xtask:native"]

# the tcg smoke programs of QEMU's tests/tcg run through its generated Makefiles (qemu_gate.rs)
[make]
debian = "make"
arch = "make"
binary = "make"
min = "4.4.1"
min_reason = "observed 2026-11-08; older is untested"
scope = ["test"]
used_by = ["upstream:qemu"]

# Mesa's build: meson_version '>= 1.1.0' (external/mesa3d/meson.build:9); mesa.rs runs `meson setup` with platforms=android.
# QEMU's meson_version '>=1.5.0' (meson.build:1) is the larger; QEMU's own pythondeps.toml accepts the same.
[meson]
debian = "meson"
arch = "meson"
binary = "meson"
min = "1.5.0"
min_reason = "QEMU meson.build:1 meson_version >=1.5.0; Mesa meson.build:9 >=1.1.0"
scope = ["build"]
used_by = ["xtask:native", "upstream:qemu"]

[ninja]
debian = "ninja-build"
arch = "ninja"
binary = "ninja"
min = "1.12.1"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native", "upstream:qemu"]

# atld's CA store tests: `openssl x509 -subject_hash_old` is the independent oracle of the store's file names; `openssl req` makes the same-subject pair of the collision test
[openssl]
debian = "openssl"
arch = "openssl"
scope = ["test"]
used_by = ["crate:atld"]

# the PCM output (plan A0, atl-platform-ui-linux audio.rs): pipewire-sys's build script resolves libpipewire-0.3 through pkg-config; min = the crate's `v0_3_49` feature (Buffer::requested)
[pipewire]
debian = "libpipewire-0.3-dev"
arch = "pipewire"
pkgconfig = "libpipewire-0.3"
min = "0.3.49"
min_reason = "pipewire crate feature v0_3_49: Buffer::requested, the frames the graph asks for in each process callback"
scope = ["build", "runtime"]
used_by = ["crate:atl-platform-ui-linux"]

# the audio gate's tools (xtask test audio-pcm): the private server with no session manager (pipewire), the null sink and default-sink metadata (pw-cli, pw-metadata), the monitor recording (pw-record)
[pipewire-bin]
debian = "pipewire-bin"
arch = "pipewire"
scope = ["test"]
used_by = ["xtask:test"]

# resolves deps.toml pkgconfig modules: versions (xtask deps) and providers.toml system: rows (xtask native)
[pkgconf]
debian = "pkgconf"
arch = "pkgconf"
binary = "pkg-config"
min = "1.8.1"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:deps", "xtask:native", "upstream:qemu"]

# AOSP genrule scripts run under it (tools/bp2ninja/genrule.go)
[python3]
debian = "python3"
arch = "python"
binary = "python3"
min = "3.13.5"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native", "upstream:qemu"]

[python3-venv]
debian = "python3-venv"
# Arch's python package includes venv/ensurepip
arch = "python"
scope = ["build"]
used_by = ["upstream:qemu"]

# the native bridge side's Rust std: bp2ninja compiles its crates (libc's libicu4x_bionic) with --target = Soong rust/config RustTriple of the guest arch
[rust-std-android-x86-64]
rustup_target = "x86_64-linux-android"
scope = ["build"]
used_by = ["xtask:native"]

# the riscv64 cross build's std (`xtask cross --arch riscv64`)
[rust-std-riscv64]
rustup_target = "riscv64gc-unknown-linux-gnu"
scope = ["build"]
used_by = ["xtask:cross"]

# the riscv64 cross link's glibc, kernel headers and GCC runtime: Debian trixie's cross packages (arch all), pinned to trixie main
# (linux-libc-dev from main, not backports). libgcc-14-dev lays out usr/lib/gcc-cross/riscv64-linux-gnu/14, the GCC install clang
# finds under the sysroot: crtbeginS.o/crtendS.o, the libgcc_s.so linker script, and (through it) usr/riscv64-linux-gnu/lib's crt1.o.
[riscv64-sysroot]
sysroot_debs = [
    "libc6-riscv64-cross=2.41-11cross1",
    "libc6-dev-riscv64-cross=2.41-11cross1",
    "linux-libc-dev-riscv64-cross=6.12.38-1cross1",
    "libgcc-s1-riscv64-cross=14.2.0-19cross1",
    "libgcc-14-dev-riscv64-cross=14.2.0-19cross1",
]
scope = ["build"]
used_by = ["xtask:cross"]

# the headless gates' nested compositor (nested_wayland.rs:5-8: labwc over sway)
[labwc]
debian = "labwc"
binary = "labwc"
min = "0.8"
min_reason = "nested_wayland.rs:10: labwc >= 0.8"
scope = ["test"]
used_by = ["xtask:test"]

# xtask native's compiler cache (CompilerCache in native.rs): C/C++ compiles of the converter's builds, shared by every out dir
[sccache]
debian = "sccache"
arch = "sccache"
binary = "sccache"
min = "0.10.0"
min_reason = "observed 2026-11-07; older is untested"
scope = ["build"]
used_by = ["xtask:native"]

# ChildGuard (nested_wayland.rs): `setpriv --pdeathsig TERM` ends the child when xtask dies
[setpriv]
debian = "util-linux"
arch = "util-linux"
binary = "setpriv"
min = "2.41.5"
min_reason = "observed 2026-11-07; older is untested"
scope = ["test"]
used_by = ["xtask:test"]

[unshare]
debian = "util-linux"
arch = "util-linux"
binary = "unshare"
min = "2.41.5"
min_reason = "observed 2026-11-07; older is untested"
scope = ["runtime", "test"]
used_by = ["xtask:run-apk"]

[vulkan]
debian = "libvulkan-dev"
arch = "vulkan-icd-loader"
pkgconfig = "vulkan"
scope = ["build", "runtime"]
used_by = ["upstream:aosp"]

# Soong's .asm rule is yasm (cc/builder.go, a prebuilt there); its -f/-m flags are yasm syntax. libjpeg-turbo's x86 SIMD sources.
[yasm]
debian = "yasm"
arch = "yasm"
binary = "yasm"
min = "1.2.0"
min_reason = "libjpeg-turbo BUILDING.md: if using Yasm, 1.2.0 or later is required"
scope = ["build"]
used_by = ["xtask:native"]

# QEMU's zlib (meson.build:1160, dependency required: true)
[zlib]
debian = "zlib1g-dev"
arch = "zlib"
pkgconfig = "zlib"
scope = ["build"]
used_by = ["upstream:qemu"]
