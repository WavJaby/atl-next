# SPDX-License-Identifier: MIT

[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Every dependency is declared here once; member crates use `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1"
clang ={ version = "2.1", features = ["clang_10_0"] }
# atl-bridgegen: `support::Clang::find` locates the clang binary paired with libclang (bindgen's route), for its resource dir
clang-sys = "1.9"
clap = { version = "4", features = ["derive"] }
# C++ bridge of atl-libinput (AOSP libinput's public API). Not AOSP's 1.0.119: that predates edition 2024 and carries RUSTSEC-2026-0202 (fixed 1.0.195). From 1.0.198 cxxbridge-macro uses syn 3, the workspace's syn (no duplicate); from 1.0.190 it pulls foldhash (Zlib, see deny.toml exceptions)
cxx = "1.0.205"
cxx-build = "1.0.205"
errno = "0.3"
# the desktop's font configuration (atl-platform-host-linux fonts.rs), linked: fontconfig is a required system library; deny.toml keeps it in the platform layer
fontconfig = "0.11.0"
# CLDR likely subtags (atl-fonts): AOSP's `und-<Script>` fallback langs -> the language a desktop font lists (`und-Hebr` -> `he`), from ICU4X's compiled data instead of a hand table
icu_locale = "2"
# SYS_* syscall numbers per target arch (atl-broker seccomp filter); the only use of libc is those constants
landlock = "0.4.7"
libc = "0.2"
# libgbm bindings; no wayland / egl import and no drm crate (its 0.14 pins a second rustix): the allocator creates linear buffers and exports them itself (atl-gralloc-service `prime`)
gbm = { version = "0.18", default-features = false }
# GLib's unix fd sources (`g_unix_fd_add`), split out of glib-rs in 0.22; same gtk-rs release train as gtk4
glib-unix = "0.22"
# GTK4 bindings (re-exporting gdk, gsk, glib, gio, graphene): only atl-platform-ui-linux and atl-platform-host-linux depend on it (deny.toml bans). v4_14 = the X8 memory formats (opaque layers) on top of v4_12's fractional surface scale; Debian 13 ships 4.18
gtk4 = { version = "0.11", features = ["v4_14"] }
gdk4-wayland = "0.11"
object ={ version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
# PipeWire client (plan A0): the PCM output of atl-platform-ui-linux, over the safe pipewire crate and its pipewire-sys / libspa bindings (libpipewire-0.3: deps.toml [pipewire]); deny.toml keeps it out of every crate but -linux
pipewire = "0.10.1"
# xtask only: `run-apk --drive` screenshots
png = "0.18"
roxmltree = "0.21"
rustix = { version = "1", features = ["event", "fs", "mm", "net", "param", "process", "stdio", "thread", "time"] }
serde = { version = "1", features = ["derive"] }
# what a face is (atl-fonts): OS/2 weight + italic, post fixed pitch, fvar axes, name ID 6, cmap + hmtx for the font gate; fontations' parser of untrusted font files (ttf-parser: RUSTSEC-2026-0192 unmaintained)
read-fonts = "0.46"
seccompiler = "0.5"
serde_json = "1"
# SHA-256 of test APK files and of their signing certificates (xtask test-apks.toml rows)
sha2 = "0.11"
spdx = "0.13"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
# Wayland client on its pure-Rust backend (no libwayland, no `unsafe` in our crate): atl-platform-ui-linux's own connection for wl_output transforms, which GDK reads but does not expose (deny.toml bans)
wayland-client = "0.31"
# APK reading for the install's native-library extraction (atl-services native_libs, temporary until the installer process runs AOSP's NativeLibraryHelper); inflate via flate2 + zlib-rs only (feature `deflate` would add the zopfli compressor)
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# no `attributes` (the #[instrument] macro): it is the only user of syn 2, the rest of the graph is on syn 3
tracing = { version = "0.1", default-features = false, features = ["std"] }
# the app process's log (atl-app-launcher trace.rs): stderr with a RUST_LOG filter; no ansi, the log files carry no colours
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

# Inherited by every crate via `[lints] workspace = true`; such a crate cannot add lints in its own
# Cargo.toml, so crate-specific extras (`missing_docs` in `-api` crates, `forbid(unsafe_code)` in core
# crates) go in the crate root as inner attributes.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# unimplemented paths go through `unimplemented_api!` (plan F4), never `unimplemented!`
unimplemented = "deny"
# logging only via `tracing`
print_stdout = "deny"
print_stderr = "deny"
# allowed in tests via clippy.toml `allow-unwrap-in-tests`; elsewhere `expect("reason")` or `?`
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

# Dev builds keep line tables only: backtraces still show file:line; variable and type debuginfo is dropped.
[profile.dev]
debug = "line-tables-only"
