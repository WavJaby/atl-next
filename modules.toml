# SPDX-License-Identifier: MIT
# Architecture modules and the edges between them. `cargo xtask check` step `modules` fails unless this
# file equals the real crate graph: an undeclared edge fails, and so does a declaration no edge uses.
# Architecture diagrams are generated from it, never drawn by hand.
#
# Row key: module name.
#   crates     workspace crates of this module; every crate is in exactly one module
#   exports    crates other modules may depend on (the module's interface); default none
#   uses       modules whose exports this module depends on; default none
#   [<module>.direct_link.<target>]
#     reason   a declared crossing into non-exported crates of <target> (e.g. zero-copy buffer sharing)
# Module edges form no cycle. External crates are not listed here; deny.toml governs them.
# Covers cargo crates only (no AOSP / ninja modules yet).

# the bionic-only C API for source-built AOSP code (bridge 1 class b); the loader uses it later
[bionic]
crates = ["atl-bionic"]
exports = ["atl-bionic"]
uses = ["generators"]

# the system property service: the default property set as a bionic property area, written through bionic's image builder; atld writes the area through it, the binary serves test harnesses
[property-service]
crates = ["atl-property-service"]
exports = ["atl-property-service"]
uses = ["bionic"]

# the one launcher of sandboxed processes (plan Q5; M2 depth Q4(a): bwrap user + pid namespaces, /system and /data mounts), each registered with binderd; its `control` module is the protocol by which the services ask for process starts and kills
[broker]
# atl-sandbox-stub: the in-child stage bwrap runs before the program (Landlock, then exec); atl-sandbox-probe: what an app process reaches (`xtask test sandbox`)
crates = ["atl-broker", "atl-sandbox-stub", "atl-sandbox-probe"]
exports = ["atl-broker"]
uses = ["binder", "android-paths", "bwrap"]

# the Android filesystem layout inside the sandbox: the only home of Android path literals (xtask check step android-paths)
[android-paths]
crates = ["atl-android-paths"]
exports = ["atl-android-paths"]

# M2 wiring: binderd, servicemanager, the services and the apps, each a process started through the broker; serves the services' process control; the install step reads the package records (services' plain types); the VINTF manifests declare the graphics HALs (gralloc's definitions); the system font files come from the desktop's fonts (fonts)
[atld]
crates = ["atld"]
uses = ["binder", "broker", "gralloc", "platform-host", "property-service", "services", "services-types", "android-paths", "fonts", "fonts-table"]

# the user's launch surface (plan gpu-selection S2.5): `run --gpu`, the per-app GPU preference, the `.desktop` writer; it execs the ATL command (or switcherooctl) and links no ATL crate
[launch]
crates = ["atl-launch"]

# the app process's entry: JNI invocation of the converter's ART, liblog's logger, bionic's property and target-SDK API, all resolved at run time; bionic only for its API's names; the process's SurfaceFlinger (composer), started in app mode; UI mode's GTK session (platform-ui), attached before Java
[launcher]
crates = ["atl-app-launcher"]
uses = ["generators", "bionic", "composer", "platform-ui", "service-view", "audioflinger", "codec-store", "resource-manager", "media-player", "media-extractors"]

# the process's own view of servicemanager: names the app process serves itself (its SurfaceFlinger, the Codec2 store, the media resource manager, media.player) answered in-process, the rest forwarded; libbinder reached through cxx adapters (wrap/view.cpp)
[service-view]
crates = ["atl-service-view"]
exports = ["atl-service-view"]
uses = ["aidl", "generators", "services-types"]

# the extractor plugins of the app process (audio M1): AOSP's MediaExtractorFactory::LoadExtractors, the call only the media.extractor service makes; cxx forwarder in wrap/extractors.cpp
[media-extractors]
crates = ["atl-media-extractors"]
exports = ["atl-media-extractors"]
uses = ["generators"]

# the Codec2 store the app process serves through the view (audio M1): AOSP's aidl ComponentStore over the platform store, as IComponentStore/default; cxx adapter in wrap/store.cpp
[codec-store]
crates = ["atl-codec-store"]
exports = ["atl-codec-store"]
uses = ["service-view", "generators"]

# the media resource manager the app process serves through the view (audio M1): AOSP's ResourceManagerService built as-is, as media.resource_manager (MediaCodec waits for it); cxx adapter in wrap/rms.cpp
[resource-manager]
crates = ["atl-resource-manager"]
exports = ["atl-resource-manager"]
uses = ["service-view", "generators"]

# the media player service the app process serves through the view (audio P1a): AOSP's MediaPlayerService constructed as instantiate() does minus addService, as media.player (MediaPlayer's native calls wait for it); cxx adapter in wrap/player.cpp
[media-player]
crates = ["atl-media-player"]
exports = ["atl-media-player"]
uses = ["service-view", "generators"]

# AudioFlinger and AudioPolicyService the app process serves through the view (audio A1a, A1b, A2): AOSP's audio AIDL stubs (atl-audioflinger-stubs-rust) answering the ids, the served output profile, createTrack and the mixer; the rest is counted UNKNOWN_TRANSACTION. The PCM output comes from platform-ui
[audioflinger]
crates = ["atl-audioflinger"]
exports = ["atl-audioflinger"]
uses = ["service-view", "services", "services-types", "generators", "audio-bridge", "platform-ui"]

# AOSP's server side of a track (ServerProxy over the mapped control block and buffer) and its mixer (AudioMixerBase), through cxx (wrap/mix.cpp): the boundary crate for atl-audioflinger's data plane (audio A2); libaudioclient and libaudioprocessing_base from the converter
[audio-bridge]
crates = ["atl-audio-bridge"]
exports = ["atl-audio-bridge"]
uses = ["generators"]

# the app process's SurfaceFlinger (M3 slice 4): AOSP's compositor interfaces served in-process over the compositor core, through the converter's AIDL stubs; the display model and the registry protocol are the services' plain modules
[composer]
crates = ["atl-composer"]
exports = ["atl-composer"]
uses = ["aidl", "compositor", "libgui-parcel", "ime", "libinput", "platform-ui", "scene-buffer", "services", "services-types", "generators", "android-paths", "service-view", "gralloc"]

# framework natives (libandroid_runtime) ATL implements itself instead of building their AOSP sources
[android-runtime]
crates = ["atl-android-runtime"]

# Rust stubs of AIDL interfaces against AOSP's libbinder_rs, both from the converter (built by `xtask native` after it), and the Rust types of the Java-only parcelables they pass (a converter rust_library)
[aidl]
crates = ["atl-aidl", "atl-parcelables", "atl-parcel-truth"]
exports = ["atl-aidl"]
# compositor, libgui-parcel: atl-parcel-truth's compositor.rs checks their codecs against libgui (test-only)
uses = ["generators", "compositor", "libgui-parcel"]

# the M2 system services in Rust (ActivityManager subset, PackageManager subset, the settings provider stub) on the aidl stubs; libbinder_rs and the codecs come from the converter, not cargo
[services]
crates = ["atl-services"]
# the package record types (plain Rust, no converter) are what atld installs and xtask writes
exports = ["atl-services"]
# libgui-parcel: finishDrawing frames the post-draw Transaction with libgui's reader to forward it (window.rs); platform-host: the sensor service reads the machine's accelerometers through it (sensor.rs); gralloc: atl-screencap reads the captured buffer's dma-buf (screencap.rs)
uses = ["aidl", "generators", "broker", "libinput", "android-paths", "libgui-parcel", "platform-host", "gralloc", "services-types"]

# AOSP libinput as the converter builds it, reached through cxx adapters (wrap/input.cpp): the input publisher and the virtual keyboard's KeyCharacterMap; C++ only as the adapters the project CLAUDE.md allows
[libinput]
crates = ["atl-libinput"]
exports = ["atl-libinput"]
uses = ["generators"]

# the in-app compositor core (M3 slice 3): layer tree, buffer cache, release / completion callbacks and their codecs, vsync EventThread, the Scene for the platform layer; plain Rust, no binder or converter dependency
[compositor]
crates = ["atl-compositor"]
exports = ["atl-compositor"]
uses = ["libgui-parcel"]

# libgui's Parcel formats (bytes + object-table Parcel, layer_state_t, TransactionState, the client Transaction, flat-object scanning): one decoder shared by the composer and the window service, as libgui is by SurfaceFlinger and system_server; plain Rust
[libgui-parcel]
crates = ["atl-libgui-parcel"]
exports = ["atl-libgui-parcel"]

# gralloc (M3 slice 2): AOSP libui's Gralloc5 halves -- the AIDL IAllocator service (GBM on the host's DRM device) and the stable-C IMapper v5 library (mapper.atl.so, dma-buf mapping), agreeing through the core's handle / metadata / VINTF definitions; CPU access to a buffer's dma-buf (mmap + DMA_BUF_IOCTL_SYNC) is one crate the mapper and the Scene reader share; the truth crate is `xtask test gralloc`'s two-process client of AOSP's libui (test-only)
[gralloc]
crates = ["atl-gralloc", "atl-gralloc-dmabuf", "atl-gralloc-mapper", "atl-gralloc-service", "atl-gralloc-truth"]
exports = ["atl-gralloc", "atl-gralloc-dmabuf"]
uses = ["aidl", "generators"]

# the GLES driver over the host's system EGL (replan 2026-11-09): host libEGL behind safe types (devices, displays, contexts, dma-buf EGLImages, FBOs, native fences); the driver libGLES_atl.so AOSP's loader opens (window surfaces over ANativeWindow, FBO 0); the probes (P0a; the driver loaded as Loader.cpp loads it, rendering into an ANativeWindow of gralloc buffers)
[egl-host]
crates = ["atl-egl-host", "atl-egl-driver", "atl-egl-probe"]
exports = ["atl-egl-host", "atl-egl-driver"]
uses = ["gralloc", "generators"]

[egl-host.direct_link.gralloc]
reason = "the probes allocate through the same GBM backend as the allocator service (atl-gralloc-service Backend::start), so the buffer is the one an app would get; the driver itself takes gralloc's node from atld (atl_gralloc::node), not from a second trial"

# the app-process half of the platform layer (M3 slice 6, plan S1 `atl-platform-ui`): the -api traits (window, frame clock, input, main loop), the GTK4 implementation (the one crate deny.toml lets depend on GTK) and the facade core crates use; presents the compositor's Scene, importing each quad's dma-buf as a GTK dmabuf texture (layout through scene-buffer, the read fence through gralloc-dmabuf)
[platform-ui]
crates = ["atl-platform-ui-api", "atl-platform-ui-linux", "atl-platform-ui"]
exports = ["atl-platform-ui"]
uses = ["compositor", "libgui-parcel", "gralloc", "scene-buffer", "platform-types"]

[platform-ui.direct_link.gralloc]
reason = "the facade's gate example (xtask test platform-ui) allocates real dma-bufs through gralloc's GBM backend (atl-gralloc-service), as the allocator service does: a dmabuf texture needs a real dma-buf, a memfd is refused"

# the app process's in-app input method (IME plan route R1): the Rust IInputMethod / IInputMethodSession IMMS-lite binds, adapting the desktop's input method (platform-ui TextInput) to the focused field's InputConnection (aidl stubs); the text-index unit conversions
[ime]
crates = ["atl-ime"]
exports = ["atl-ime"]
uses = ["aidl", "platform-ui", "generators"]

# the value types both platform halves speak (physical size, scale, monitor) and the one conversion from a desktop's report into them; no OS or toolkit dependency
[platform-types]
crates = ["atl-platform-types"]
exports = ["atl-platform-types"]

# Android's system font list from the desktop's (plan C7): fonts.toml + AOSP's alias/fallback-order data + the platform layer's FontSource -> font_fallback.xml, fonts.xml and the font dirs to expose
[fonts]
crates = ["atl-fonts"]
exports = ["atl-fonts"]
uses = ["platform-host", "fonts-table"]

# the host half of the platform layer (plan S1 `atl-platform-host`): the desktop's monitors and fonts as atld and xtask read them (refresh rate so far); the GDK implementation is the second crate deny.toml lets depend on GTK
[platform-host]
crates = ["atl-platform-host-api", "atl-platform-host-linux", "atl-platform-host"]
exports = ["atl-platform-host"]
uses = ["platform-types"]

# a Scene buffer's pixels on the CPU (the quad's dma-buf copied through gralloc's CPU-access crate, sync_file polling), read through gralloc's format and handle definitions: what the GTK presenter and the compositor's scene checks (composer) share
[scene-buffer]
crates = ["atl-scene-buffer"]
exports = ["atl-scene-buffer"]
uses = ["compositor", "gralloc"]

# binder IPC: uapi wire types + socket protocol, the userspace driver (core + socket server), libbinder's driver I/O over it
[binder]
crates = ["atl-binder-wire", "atl-binderd", "atl-binder-driver"]
exports = ["atl-binderd"]
uses = ["generators"]

# the NativeBridge core ART loads (`-XX:NativeBridge=`, plan S11 NB): which app libraries are bridged (`elf`) and the NativeBridgeCallbacks shells generated from native_bridge.h; bridge 1's identity engine loads them into its guest (Android paths: the installed guest)
[native-bridge]
crates = ["atl-native-bridge", "atl-guest-dlsym"]
exports = ["atl-native-bridge"]
# cpu-pressure: g4's starvation share over its run (test-only dev-dependency); engine-api: the engine C ABI the QEMU crossing calls the engine `.so` through (plain dependency, no code; the engine is a dlopen, not a cargo edge)
uses = ["generators", "android-paths", "cpu-pressure", "engine-api"]

# the QEMU translator engine (QEMU bridge plan Q2 spike): QEMU's linux-user core dlopened as a library, P1's svc hook, the fault chain in front of QEMU's handler; CPU layouts generated from QEMU's cpu.h; exports its `Trap` to the native bridge's QEMU crossing (Q4)
[qemu-engine]
crates = ["atl-qemu-engine", "atl-qemu-boot"]
exports = ["atl-qemu-engine"]
uses = ["generators", "engine-api"]

# the engine C ABI (QEMU bridge plan Q5-1a): include/atl_engine.h and its Rust mirror, the table the engine `.so` exports as atl_engine; no code of its own
[engine-api]
crates = ["atl-engine-api"]
exports = ["atl-engine-api"]
uses = []

[generators]
crates = ["atl-bridgegen"]
# build-dependency of crates whose types are generated from upstream headers, and of atl-native-bridge's x86 entry shells, call pools and patch templates (bridgegen x86.rs, QEMU bridge plan Q5-7)
exports = ["atl-bridgegen"]
uses = ["layout"]

# the one resolver of upstream checkouts (src/ or a task copy): xtask and build scripts place sources through it
[layout]
crates = ["atl-layout"]
exports = ["atl-layout"]

# host CPU starvation over a window (PSI `some` stall share) and the one judgement made over it (`judge_window`): the cadence window and g4 share it; a host measurement, no product code
[cpu-pressure]
crates = ["atl-cpu-pressure"]
exports = ["atl-cpu-pressure"]

# definition crates below (no build script, no runtime crate): shared by the product and xtask, so the bootstrap tool builds without the product
# bubblewrap's argv, spelled once (F1.1): the broker's sandbox profiles and xtask's build-tree namespace
[bwrap]
crates = ["atl-bwrap"]
exports = ["atl-bwrap"]

# the system services' plain types and policy: package records, manifest flags, GL driver owners, display model, registry names, uid identity and permission rules, the unimplemented-method counters
[services-types]
crates = ["atl-services-types"]
exports = ["atl-services-types"]
# android-paths: a test checks a record path against the guest layout (dev-dependency)
uses = ["android-paths"]

# the font tables: fonts.toml and AOSP's alias / fallback-order JSON, parsed and checked
[fonts-table]
crates = ["atl-fonts-table"]
exports = ["atl-fonts-table"]

# the bootstrap tool (`cargo xtask`): fetch, native, check and the other non-runtime commands; definition crates only, so it builds in a fresh checkout. Its library is what the harness reuses (layout, slots, build records, native goals, verdict lines)
[xtask]
crates = ["xtask"]
exports = ["xtask"]
# bwrap: the build-tree namespace's argv (tree.rs); services-types: the package manifest records xtask writes for atld, and gl-drivers.toml's parser (step tables); android-paths: the roots its android-paths check step scans for; fonts-table: the tables step checks fonts.toml
uses = ["layout", "bwrap", "services-types", "android-paths", "fonts-table"]

# the runtime harness: `cargo xtask test|run-apk|remote` and the check steps that need product logic (gl-proxies), run by xtask as a process
[xtask-harness]
crates = ["xtask-harness"]
# xtask: its library; broker: its control protocol, mounts and launcher, used by the runtime gates; bwrap: the task-bind gate's namespace argv; services-types: the package manifest records the gates write for atld; gralloc: the VINTF declarations and mapper library name the gralloc gate and atld share; native-bridge: its library name, staged for atld runs, its binding table (step gl-proxies) and its `isSupported` classifier the jni-fixture gate runs on the fixture; android-paths: the guest paths of the records it writes; platform-host: the app sandbox's access and the PipeWire socket; cpu-pressure: the cadence window's starvation share (judge_window); generators: the aarch64 thunk-pool emitter (atl_bridgegen::aarch64) writes the QEMU spike fixture's pool, and the spike check reads it back
uses = ["xtask", "layout", "broker", "bwrap", "services-types", "gralloc", "platform-host", "native-bridge", "android-paths", "cpu-pressure", "generators"]
