# SPDX-License-Identifier: MIT
# The Rust system services (crate atl-services) and the AOSP code each one reproduces: what an AOSP tag bump must be reviewed against (`xtask upgrade-diff <old> <new>` prints the churn per entry).
#
# Row key: the servicemanager name the service is registered under. The set of rows must equal the names atl-system-services registers (`binder::add_service` in crates/atl-services/src/bin/system_services.rs), checked by step `tables` of `xtask check`.
#   src       the Rust files that implement the service, repo-relative; each must exist.
#   mirrors   AOSP tree paths at the pin in sources.toml, each `<path>` (whole file) or `<path>#<Name>`. A Name starting upper-case is a class/interface/enum/record and must be declared in the file
#             (`class Name`, ...); one starting lower-case is a method and must be declared there: a line `<modifiers/annotations> <type> name(` (a call or a field does not count). Overloads count as one entry.
#             The file is read from the pinned commit of its project (longest `[aosp.projects]` prefix), not the checkout's working tree, so our patches never hide upstream churn.
#   reason    required exactly when `mirrors` is empty: why the service reproduces no AOSP code. Prose, not checked.
# Rows list the AOSP code the Rust logic copies behaviour from, plus the client-side wire it speaks when that wire is not generated from AIDL (servertransaction items). AIDL files are not listed: the converter regenerates the stubs.

[activity]
src = [
    "crates/atl-services/src/activity.rs",
    "crates/atl-services/src/activity_stack.rs",
    "crates/atl-services/src/config_diff.rs",
    "crates/atl-services/src/size_buckets.rs",
    "crates/atl-services/src/process_control.rs",
]
