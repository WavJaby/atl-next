# SPDX-License-Identifier: MIT
# The only list of architectures. Every name a tool needs for an arch is a column here; nothing converts
# arch names ad hoc. Adding an arch = one row here + its per-arch modules, no edits elsewhere.
#
# Row key: ART instruction-set string (`GetInstructionSetString`), also the per-arch module name and Soong's arch name (TARGET_ARCH / TARGET_NATIVE_BRIDGE_ARCH; Soong rejects an unknown one).
#   pointer_bits      32 | 64
#   soong_arch_variant  ISA baseline AOSP code is built for in either role (TARGET_ARCH_VARIANT / TARGET_NATIVE_BRIDGE_ARCH_VARIANT); absent = Soong's baseline for the arch.
#                     Soong has no baseline for arm/arm64 and rejects a missing or unknown variant there.
#   kernel_arch       Linux kernel arch: the uapi `asm-<kernel_arch>` directory (bionic `libc_uapi_headers` arch block, checked against the fetched tree)
#   uapi_records      records `asm-<kernel_arch>/asm/ptrace.h` declares that AOSP's <sys/ptrace.h> consumers read by layout: the arch's branch of libmemunreachable ThreadCapture.cpp (pt_regs on arm/x86, user_pt_regs on arm64, user_regs_struct on riscv64). atl-bionic emits them; checked against that header (xtask check tables)
# `[<arch>.host]` present = we build and run on it (one 64-bit process per app):
#   rust              Rust target triple of the host build; a cross host's product crates take it as rustc --target, with its isa's extensions as target features (native.rs cross_args)
#   meson_cpu_family  meson `cpu_family` (QEMU cross files)
#   debian            Debian architecture name; for a sysroot row, the arch of its private apt index (cache/apt/<debian>)
#   archlinux         Arch Linux architecture; absent where Arch has no official port
#   soong_prebuilt_os Soong's PrebuiltOS of the BUILD MACHINE, whatever this row's arch (build/soong/android/config.go): `prebuilts/build-tools/<it>/bin` holds the
#                     prebuilt build-only tools the converter runs (aconfig, ...). xtask native reads the build machine's row (the one whose `rust` is rustc's host), so a cross host row has none.
#                     Absent = Soong ships none there. Checked: a linux value PrebuiltOS returns, and the directory exists in the fetched tree.
#   isa               ISA baseline of this host's own code, cross builds only (`xtask cross`, `xtask native` of a host other than the build machine): `rv64gc_` + Z extensions. The Rust target fixes the base; each extension becomes a `+ext` rustc target feature. Checked: base is rv64gc, every extension is a rustc feature of `rust`. isa_gate checks each output's `Tag_RISCV_arch` against the closure (implied extensions included, arches.rs isa_closure); isa-tiers.toml rows let one source of a module claim one more extension (run-time tier, isa_tiers.rs).
#   glibc_floor       newest GLIBC_x.y an output of this host may need: the glibc of the oldest machine it runs on (owner decision). Cross hosts only (with isa). Checked: dotted version; isa_gate fails any output that needs a newer one.
#   clang             clang triple of the cross compiler and link driver (`--target=<it>`), cross builds only; its arch part is the arch name. Checked: clang accepts it.
#   sysroot           deps.toml row of this host's sysroot (a `sysroot_debs` row). Every host's atl-bridgegen probes read it (atl-bridgegen buildscript::host_sysroot_args), the build machine's too; a cross build also links against it. Checked: the row exists.
# `[<arch>.guest]` present = app native code of this arch runs (natively on a matching host, else via
# the QEMU bridge):
#   android_abis      APK `lib/<abi>/` names, preferred first
#   clang             clang triple for guest bionic and guest libs (Soong `ClangTriple`)
#   qemu_target       QEMU linux-user target (`<qemu_target>-linux-user`)
#   rust              Rust target triple of our guest code (the engine boot executable, crates/atl-qemu-boot); absent = none for this arch yet. Checked: rustc lists it, and its arch part is qemu_target.
#
# No priority or engine columns: ABI preference (native > translated 64-bit > translated 32-bit) follows
# from host match and pointer_bits; one translator engine exists.
# Later-goal arches get a row when work on them starts.

[arm]
pointer_bits = 32
kernel_arch = "arm"
uapi_records = ["pt_regs"]
# AOSP's generic boards use it for 32-bit arm
soong_arch_variant = "armv7-a-neon"

[arm.guest]
android_abis = ["armeabi-v7a", "armeabi"]
clang = "armv7a-linux-androideabi"
qemu_target = "arm"

[arm64]
pointer_bits = 64
kernel_arch = "arm64"
uapi_records = ["user_pt_regs"]
# ARMv8.0: what every arm64 app may assume
soong_arch_variant = "armv8-a"

[arm64.host]
rust = "aarch64-unknown-linux-gnu"
meson_cpu_family = "aarch64"
debian = "arm64"
soong_prebuilt_os = "linux-arm64"

[arm64.guest]
android_abis = ["arm64-v8a"]
clang = "aarch64-linux-android"
qemu_target = "aarch64"
rust = "aarch64-linux-android"

[riscv64]
pointer_bits = 64
kernel_arch = "riscv"
uapi_records = ["user_regs_struct"]

[riscv64.host]
rust = "riscv64gc-unknown-linux-gnu"
meson_cpu_family = "riscv64"
debian = "riscv64"
# owner 2026-11-08: no V, no Zbs (the riscv64 test host has neither; device tree riscv,isa-extensions)
isa = "rv64gc_zba_zbb"
# outputs run on the test host (Ubuntu 24.04, glibc 2.39); the sysroot is Debian 13 (glibc 2.41), so no output may need a newer GLIBC_ version
glibc_floor = "2.39"
clang = "riscv64-linux-gnu"
sysroot = "riscv64-sysroot"

[riscv64.guest]
android_abis = ["riscv64"]
clang = "riscv64-linux-android"
qemu_target = "riscv64"

[x86]
pointer_bits = 32
kernel_arch = "x86"
uapi_records = ["pt_regs"]

[x86.guest]
android_abis = ["x86"]
clang = "i686-linux-android"
qemu_target = "i386"

[x86_64]
pointer_bits = 64
kernel_arch = "x86"
uapi_records = ["pt_regs"]

[x86_64.host]
rust = "x86_64-unknown-linux-gnu"
meson_cpu_family = "x86_64"
debian = "amd64"
archlinux = "x86_64"
soong_prebuilt_os = "linux-x86"
sysroot = "x86-64-sysroot"

[x86_64.guest]
android_abis = ["x86_64"]
clang = "x86_64-linux-android"
qemu_target = "x86_64"
