# SPDX-License-Identifier: MIT
[package]
name = "atl-parcelables"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Rust types of the unstructured (Java-only) parcelables framework AIDL names, for the converter's AIDL crates (atl-aidl `aidl.parcelables`).
# The converter builds src/lib.rs as rust_library `libatl_parcelables` against these rustlibs, with its generated parcelables.rs (xtask packages.rs, bp2ninja aidlcrates.go).
# Cargo builds an empty library: lib.rs is `#![cfg(soong)]`, a cfg only the converter passes.
# aconfig: the framework flags the codecs' formats depend on (Intent: android.security.prevent_intent_redirect), as aconfig evaluates them for the release (src/aconfig.rs).
[package.metadata.atl.rust_library]
rustlibs = ["libbinder_rs"]
aconfig = ["android.security.flags-aconfig"]

[lints]
workspace = true
