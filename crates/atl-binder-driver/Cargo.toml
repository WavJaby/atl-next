# SPDX-License-Identifier: MIT
[package]
name = "atl-binder-driver"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atl-binder-wire = { path = "../atl-binder-wire" }
errno.workspace = true
rustix.workspace = true

[features]
# cargo-c builds with it; nothing is gated on it
capi = []

[dev-dependencies]
# a real binderd behind the driver's protocol
atl-binderd = { path = "../atl-binderd" }

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

# cargo-c: libbinder_driver (providers.toml), linked by libbinder. Its callers include libbinder's own BinderDriver.h; nothing is installed.
[package.metadata.capi.header]
generation = false
subdirectory = false

[lints]
workspace = true
