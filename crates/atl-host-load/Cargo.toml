[package]
name = "atl-host-load"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Host load over a test gate's run: the gate's own cgroup (`cpu.pressure`, `cpu.stat`) against the busy CPU of its allowed set; the running gate's samples (`live`) are what the harness's starvation rule weighs. Core crate: no unsafe.
[dependencies]
rustix.workspace = true
serde = { workspace = true, optional = true }

# `serde`: the window gate's target agent (xtask-harness `window-live`) returns its samples as JSON.
[features]
serde = ["dep:serde"]

[lints]
workspace = true
