# SPDX-License-Identifier: MIT
[package]
name = "atl-webview-linux"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Linux web engine (webview plan M68, S2.3): WebKitGTK 6.0 through webkit6, the only crate allowed to depend on it (deny.toml `wrappers`).
# Only a cdylib, `libatl_webview_linux.so`: the atl-platform-ui facade dlopens it RTLD_LOCAL on the first WebView call (`PlatformWebEngine`) and calls atl-platform-ui-api's `abi::WebViewVtable`, so WebKit's ~170-object closure loads only in processes that use WebView.

[lib]
crate-type = ["cdylib"]

[dependencies]
atl-platform-ui-api = { path = "../atl-platform-ui-api" }
tracing.workspace = true
webkit6.workspace = true
# Manifest-only: no gtk4 path in this crate (GTK types come through webkit6). Sets gtk4's feature floor (v4_14) for a build of this crate alone, as the harness stages it (xtask-harness ui_module.rs), where webkit6's gtk::Accessible impl needs gtk4 >= v4_10. deny.toml lists this crate as a gtk4 wrapper for that reason
gtk4.workspace = true

[lints]
workspace = true
