# SPDX-License-Identifier: MIT
[package]
name = "atl-platform-ui-module-fixture"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Test-only, never shipped: the process of `xtask test ui-module` (launcher-ui-module plan slice M1). Linked as the launcher is (libsigchain leads DT_NEEDED, the converter's link driver; ART not needed),
# it loads the platform module libatl_platform_ui_linux.so with dlopen(RTLD_NOW | RTLD_LOCAL) through atl-platform-ui-api's C ABI, presents a colour scene through its own Looper, then loads an app .so and reports what the app's symbols bound to.
# It never depends on atl-platform-ui-linux: GTK must reach this process only through the dlopen. Links libsigchain, so only `xtask native` builds the executable (feature `converter`).
[package.metadata.atl]
converter = ["device/libsigchain"]

[[bin]]
name = "atl-platform-ui-module-fixture"
required-features = ["converter"]

[features]
converter = []

[dependencies]
anyhow.workspace = true
atl-platform-ui-api = { path = "../atl-platform-ui-api" }
clap.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
