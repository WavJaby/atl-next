# SPDX-License-Identifier: MIT
[package]
name = "atl-platform-ui-module-fixture"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Test-only, never shipped: the process of `xtask test ui-module` (launcher-ui-module plan slice M1). Linked as the launcher is (libsigchain leads DT_NEEDED, the converter's link driver; ART not needed),
# it reaches the platform module libatl_platform_ui_linux.so through the atl-platform-ui facade (its RTLD_LOCAL loader and vtable proxies, slice M3), presents a colour scene through its own Looper, then loads an app .so and reports what the app's symbols bound to.
# GTK reaches this process only through the facade's dlopen. Links libsigchain, so only `xtask native` builds the executable (feature `converter`).
[package.metadata.atl]
converter = ["device/libsigchain"]

[[bin]]
name = "atl-platform-ui-module-fixture"
required-features = ["converter"]

[features]
converter = []

[dependencies]
anyhow.workspace = true
atl-compositor = { path = "../atl-compositor" }
atl-libgui-parcel = { path = "../atl-libgui-parcel" }
atl-platform-ui = { path = "../atl-platform-ui" }
clap.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
