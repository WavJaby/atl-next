# SPDX-License-Identifier: MIT
[package]
name = "atl-app-launcher"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The executable links the converter's libsigchain, which only `xtask native` has built: it builds this package after the converter with feature `converter` (build.rs, atl-bridgegen converter.rs).
# Plain workspace builds and tests skip the executable and take the library.
[package.metadata.atl]
converter = ["device/libsigchain"]

[[bin]]
name = "atl-app-launcher"
required-features = ["converter"]

[features]
converter = []

[dependencies]
anyhow.workspace = true
atl-bionic = { path = "../atl-bionic" }
rustix.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
