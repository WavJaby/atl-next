# SPDX-License-Identifier: MIT
[package]
name = "atl-app-launcher"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Two targets (launcher-scope-split plan X1): the executable is a loader only, linking the converter's libsigchain ahead of libc; the library is the process's runtime, built as cdylib `libatl_app_runtime.so`, which the loader dlopens RTLD_LOCAL so AOSP stays out of global scope.
# Only `xtask native` has built the converter modules: it builds this package after the converter with feature `converter` (build.rs, atl-bridgegen converter.rs); plain workspace builds and tests skip the executable. With it, in app mode, the process's SurfaceFlinger (atl-composer)
# runs in the runtime: its converter modules are linked here too (a package's link arguments reach only its own links). The audio bridge (atl-audio-bridge, game audio A2) runs there too, so its archive (AudioMixerBase's libaudioprocessing_base) and libaudioclient / libaudioutils link here.
[package.metadata.atl]
converter = ["device/libsigchain", "device/libbinder_ndk", "device/libbinder", "device/libbinder_rs", "device/libatl_parcelables", "device/atl-aidl-stubs-rust", "device/libgui_aidl_types_rs", "device/librustutils", "device/libcodec2_aidl_noisurface", "device/libcodec2_vndk", "device/libstagefright", "device/libresourcemanagerservice", "device/libdatasource", "device/libmediaextractorservice", "device/libmediaplayerservice", "device/libaudioclient", "device/libaudioprocessing_base", "device/libaudioutils"]
# the loader's DT_NEEDED leads with libsigchain only (global scope = glibc + libsigchain); the runtime cdylib links the rest
bin_needed = ["device/libsigchain"]
# the runtime cdylib goes onto the runtime library path, where the loader dlopens it by name
install_cdylib = true

[lib]
name = "atl_app_runtime"
crate-type = ["cdylib"]

[[bin]]
name = "atl-app-launcher"
required-features = ["converter"]

# the installer (plan item 4b): the same loader with the runtime's installer entry, AOSP's package parsing in a VM of its own
[[bin]]
name = "atl-installer"
path = "src/bin/atl-installer.rs"
required-features = ["converter"]

[features]
converter = ["atl-audioflinger/converter", "atl-codec-store/converter", "atl-composer/converter","atl-media-extractors/converter", "atl-resource-manager/converter", "atl-media-player/converter", "atl-service-view/converter"]

[dependencies]
anyhow.workspace = true
# the property area's variable name, named in the refusal (lib.rs load_runtime); no bionic link: the process's bionic is libatl_bionic.so, resolved by name (launcher-scope-split X2)
atl-android-paths = { path = "../atl-android-paths" }
atl-composer = { path = "../atl-composer" }
# the process's view of servicemanager, installed before the VM (lib.rs step 1b)
atl-service-view = { path = "../atl-service-view" }
# AudioFlinger and AudioPolicyService the process serves through the view (lib.rs step 1c)
atl-audioflinger = { path = "../atl-audioflinger" }
# the Codec2 store the process serves through the view (lib.rs step 1c)
atl-codec-store = { path = "../atl-codec-store" }
# the media resource manager the process serves through the view (lib.rs step 1c)
atl-resource-manager = { path = "../atl-resource-manager" }
# the media player service the process serves through the view (lib.rs step 1c)
atl-media-player = { path = "../atl-media-player" }
# the media extractor service the process serves through the view, made at launch (lib.rs step 1c)
atl-media-extractors = { path = "../atl-media-extractors" }
# UI mode (lib.rs start_ui): GTK on the main thread, its GLib context mirrored into the Looper by atl-platform-ui-linux (looper.rs is the Looper seam)
atl-platform-ui = { path = "../atl-platform-ui" }
# the run's gralloc node (property) -> its device number, what the UI's presented buffers must carry (lib.rs start_ui)
atl-gralloc = { path = "../atl-gralloc" }
rustix.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
