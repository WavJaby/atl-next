# SPDX-License-Identifier: MIT
# The media resource manager an app process serves in-process (audio M1): AOSP's ResourceManagerService (frameworks/av/services/mediaresourcemanager, built as-is by the converter), as `media.resource_manager`.
# C++ is cxx glue (src/bridge.rs) plus wrap/rms.{h,cpp}: the construction AOSP's ResourceManagerService::instantiate does, minus its servicemanager registration. No logic (project CLAUDE.md, C++ exception).
[package]
name = "atl-resource-manager"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.atl]
converter = ["device/libresourcemanagerservice", "device/libbinder_ndk", "device/libbinder", "device/libbinder_rs", "device/libatl_parcelables", "device/atl-aidl-stubs-rust", "device/libgui_aidl_types_rs", "device/librustutils"]

[features]
converter = ["atl-service-view/converter"]

[dependencies]
atl-service-view = { path = "../atl-service-view" }
cxx.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }
cxx-build.workspace = true

[lints]
workspace = true
