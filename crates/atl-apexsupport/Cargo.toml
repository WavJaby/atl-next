# SPDX-License-Identifier: MIT
[package]
name = "atl-apexsupport"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# cargo-c builds with it; nothing is gated on it
capi = []

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[dev-dependencies]
# the bionic API ffi imports; in a process, libc's provider (atl-bionic's shared library) resolves them
atl-bionic = { path = "../atl-bionic" }

# cargo-c: the shared library dependents link for libapexsupport. Its C header is generated by build.rs
# (atl-bridgegen from AOSP's android/apexsupport.h), not by cbindgen, and installs at the include root.
[package.metadata.capi.header]
generation = false
subdirectory = false

[lints]
workspace = true
