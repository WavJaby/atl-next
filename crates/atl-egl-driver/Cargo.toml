# SPDX-License-Identifier: MIT
[package]
name = "atl-egl-driver"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `libEGL_atl.so` (also placed as `libGLESv2_atl.so`): the GLES driver AOSP's libEGL loader opens by `ro.hardware.egl` in its three-library form (Loader.cpp: `lib{EGL,GLESv1_CM,GLESv2}_<name>.so`, egl* by dlsym then the driver's eglGetProcAddress, gl* through eglGetProcAddress); ES1 contexts are ANGLE's, embedded (src/es1.rs).
# Renders through the host's system EGL (atl-egl-host); window surfaces are gralloc buffers dequeued from the ANativeWindow, imported as EGLImages and drawn through an FBO the driver presents as framebuffer 0.
# Boundary crate: C ABI exports, ANativeWindow callbacks, host GL calls. The rlib is for the probe (atl-egl-probe), which loads the cdylib as AOSP's loader does and reads the generated ANativeWindow layout.
[lib]
crate-type = ["cdylib", "rlib"]

# Deliberate breaks and forced tiers (build.rs `BREAKS`, `TIERS`): only the harness's staging enables one (xtask-harness egl_driver.rs); no other feature may (xtask check source rule env-reads)
[features]
break-no_config_filter = []
break-no_window_connect = []
break-no_blit_flip = []
break-no_device_check = []
break-no_readback = []
break-force_import = []
tier-blit = []

[dependencies]
anyhow.workspace = true
atl-android-paths = { path = "../atl-android-paths" }
atl-egl-host = { path = "../atl-egl-host" }
atl-gralloc = { path = "../atl-gralloc" }
atl-gralloc-dmabuf = { path = "../atl-gralloc-dmabuf" }
libloading.workspace = true
rustix.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
