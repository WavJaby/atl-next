# SPDX-License-Identifier: MIT
[package]
name = "atl-opengl"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# cargo-c builds with it; nothing is gated on it
capi = []

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

# cargo-c: the shared library linked next to the host libEGL / libGLES* (providers.toml). Its callers include AOSP's own Khronos headers; it installs only libEGL's private headers (private/EGL/cache.h, display.h), generated by build.rs (atl-bridgegen), not by cbindgen, at the include root.
[package.metadata.capi.header]
generation = false
subdirectory = false

[lints]
workspace = true
