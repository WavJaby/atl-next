# SPDX-License-Identifier: MIT
[package]
name = "atl-gralloc-truth"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Test-only client of `xtask test gralloc` (never shipped): AOSP's own libui behind the NDK `AHardwareBuffer` API (libnativewindow -> GraphicBuffer -> Gralloc5) is the ground truth for the allocator service and mapper.atl.so.
# Two processes of one binary: `writer` allocates, locks, writes a pattern and sends the handle over a unix socket; `reader` receives it (importBuffer in a second process), compares every byte, writes back.
# Links the converter's libnativewindow (and through it libui, libbinder, libgralloctypes), so only `xtask native` builds it (feature `converter`); plain workspace builds take the empty library.
# Boundary crate, test-only: `unsafe` is the NDK C API (the AHardwareBuffer_* calls and the buffer memory they return).
[package.metadata.atl]
converter = ["device/libnativewindow", "device/liblog"]

[features]
converter = []

[[bin]]
name = "atl-gralloc-probe"
path = "src/bin/probe.rs"
required-features = ["converter"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
rustix.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
