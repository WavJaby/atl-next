# SPDX-License-Identifier: MIT
[package]
name = "atl-bionic"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
errno.workspace = true
rustix.workspace = true

[features]
# cargo-c builds with it; nothing is gated on it
capi = []

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

# cargo-c: one process-wide shared library. Its C headers are generated by build.rs (atl-bridgegen from
# bionic's headers), not by cbindgen, and install at the include root as bionic's own do.
[package.metadata.capi.header]
generation = false
subdirectory = false

[lints]
workspace = true
