# SPDX-License-Identifier: MIT
[package]
name = "atl-selinux"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# cargo-c builds with it; nothing is gated on it
capi = []

# cargo-c: linked into libselinux (providers.toml `srcs` row); libselinux's own headers declare the symbols, so no header
[package.metadata.capi.header]
generation = false

[dependencies]
atl-android-paths = { path = "../atl-android-paths" }
atl-sepolicy = { path = "../atl-sepolicy" }
libc.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }
bindgen.workspace = true

[lints]
workspace = true
