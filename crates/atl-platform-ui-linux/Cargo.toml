# SPDX-License-Identifier: MIT
[package]
name = "atl-platform-ui-linux"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Linux implementation of atl-platform-ui-api on GTK4 (M3 slice 6): the only crate allowed to depend on GTK (deny.toml `wrappers`), and with the `cfg(target_os)` that selects it living in the facade.
# One thread: GLib's default main context is mirrored into the Android Looper of the thread that attached (`mirror.rs`; the Looper polls it), so a blocked UI thread answers no `xdg_wm_base.ping`.
# `unsafe` only in `mirror` (raw g_main_context calls) and `dmabuf` (GDK borrows the dmabuf texture's fds: gtk4-rs marks the builder unsafe); the read-fence ioctl is atl-gralloc-dmabuf's.

[dependencies]
atl-compositor = { path = "../atl-compositor" }
atl-gralloc = { path = "../atl-gralloc" }
atl-gralloc-dmabuf = { path = "../atl-gralloc-dmabuf" }
atl-libgui-parcel = { path = "../atl-libgui-parcel" }
atl-platform-ui-api = { path = "../atl-platform-ui-api" }
atl-scene-buffer = { path = "../atl-scene-buffer" }
glib-unix.workspace = true
gtk4.workspace = true
rustix.workspace = true
tracing.workspace = true
wayland-client.workspace = true

[lints]
workspace = true
