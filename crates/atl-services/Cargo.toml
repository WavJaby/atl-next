# SPDX-License-Identifier: MIT
[package]
name = "atl-services"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
# activity.rs, package.rs, settings.rs translate AOSP's Java system services (Apache-2.0, attribution in each file); the rest is ours
license = "MIT AND Apache-2.0"
publish.workspace = true

# The M2 system services in Rust (owner 2026-11-03): ActivityManager (+ the ActivityTaskManager launch path and IActivityClientController), PackageManager, the settings IContentProvider stub.
# They implement the converter's AIDL stubs (atl-aidl) against libbinder_rs and the parcelable codecs (libatl_parcelables), so only `xtask native` builds them (feature `converter`);
# plain workspace builds take the policy modules (permission, packages) and their tests, counting into cargo's atl-diag (dependency `atl-diag-plain`, lib.rs).
# The stubs' module is named too: a package's link arguments reach only its own links (atl-bridgegen converter.rs), and the stubs' cc libraries (libnativewindow, libcutils, ...) come from their rlib closure.
[package.metadata.atl]
converter = ["device/libbinder_rs", "device/libatl_parcelables", "device/libatl_diag", "device/atl-aidl-stubs-rust", "device/libgui_aidl_types_rs", "device/librustutils"]

[features]
converter = ["atl-aidl/converter", "atl-libinput/converter", "atl-services-wire/converter"]

# Registers the services with servicemanager (as atld will) and serves them; `xtask test binder` runs it as uid 1000.
[[bin]]
name = "atl-system-services"
path = "src/bin/system_services.rs"
required-features = ["converter"]

# Test-only: the installer's output decoded (installed.rs) and printed as lines for `xtask test installer`.
[[bin]]
name = "atl-installer-dump"
path = "src/bin/installer_dump.rs"
required-features = ["converter"]

# Test-only client of `xtask test binder`: the M2 calls an app process makes, as an app or the system uid.
[[bin]]
name = "atl-services-client"
path = "src/bin/client.rs"
required-features = ["converter"]

# `am start` as the shell uid: startActivity with no caller app; atld spawns it for its control command `start`.
[[bin]]
name = "atl-am"
path = "src/bin/am.rs"
required-features = ["converter"]

# The display capture as screencap takes it, as the shell uid; atld spawns it for its control command `capture`.
[[bin]]
name = "atl-screencap"
path = "src/bin/screencap.rs"
required-features = ["converter"]

# Test-only server and client of `xtask test binder` (stage `sweep`): transactions of every size up to libbinder's limit, both directions and oneway, through binderd.
[[bin]]
name = "atl-binder-sweep"
path = "src/bin/binder_sweep.rs"
required-features = ["converter"]

[dependencies]
anyhow.workspace = true
atl-aidl = { path = "../atl-aidl" }
atl-android-paths = { path = "../atl-android-paths" }
atl-broker = { path = "../atl-broker" }
atl-gralloc = { path = "../atl-gralloc" }
atl-gralloc-dmabuf = { path = "../atl-gralloc-dmabuf" }
atl-libgui-parcel = { path = "../atl-libgui-parcel" }
atl-libinput = { path = "../atl-libinput" }
atl-platform-host = { path = "../atl-platform-host" }
atl-property-service = { path = "../atl-property-service" }
atl-diag-plain = { package = "atl-diag", path = "../atl-diag" }
atl-services-types = { path = "../atl-services-types" }
atl-services-wire = { path = "../atl-services-wire" }
clap.workspace = true
rustix.workspace = true
signal-hook.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
