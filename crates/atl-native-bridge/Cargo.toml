# SPDX-License-Identifier: MIT
[package]
name = "atl-native-bridge"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `libatl_native_bridge.so`: the NativeBridge core ART loads with `-XX:NativeBridge=libatl_native_bridge.so` (libnativebridge `LoadNativeBridge`: a plain file name, opened by `dlopen` through LD_LIBRARY_PATH, then `dlsym("NativeBridgeItf")`).
# Boundary crate: `unsafe` only in `exports` (the C ABI and raw pointer conversion), the generated shells and `engine` (mapping, the crossing asm, guest calls); ELF classification (`elf`) is safe.
[lib]
crate-type = ["cdylib", "rlib"]

# QEMU guest (QEMU bridge plan Q4): the engine crosses through QEMU's aarch64 user-mode core (`engine/arch/qemu.rs`), not the FS switch; the NB core ART loads is not built. Needs `ATL_QEMU_BUILD` (atl-qemu-engine's feature `qemu`).
# atl-qemu-engine is a plain dependency: its default build holds no engine code, and the module table declares this edge for every build (the static gate reads the default graph).
[features]
qemu-guest = ["atl-qemu-engine/qemu"]

# spike gates g1-g4 (bridge-1 route N), harness-less (main thread only, no runner threads touching TLS); env in tests/common/mod.rs, stages needing a native-bridge build skip without one
# g1: guest linker init through the crossing, host intact after
[[test]]
name = "g1"
harness = false

# g2: guest dlopen of an NDK app library + native calls (TLS, errno, C++ throw, nested dlopen)
[[test]]
name = "g2"
harness = false

# g3: SIGSEGV in guest code reaches the host handler on host FS and resumes on guest FS
[[test]]
name = "g3"
harness = false

# g4: crossing cost, guest->host and host->guest, 10 runs
[[test]]
name = "g4"
harness = false

# g5: the signal entry's last-chance report fires when no host thread pointer is found (fake TCB on FS), host handler still runs
[[test]]
name = "g5"
harness = false

# Q4-3 gate: the six NB entries placed in place on the real arm64 linker64 and vdso, the pages registered with QEMU, a guest calls each site (QEMU bridge plan Q4-3); needs feature qemu-guest and the spike library
[[test]]
name = "qemu_linker"
harness = false
required-features = ["qemu-guest"]

[dependencies]
atl-android-paths = { path = "../atl-android-paths" }
atl-qemu-engine = { path = "../atl-qemu-engine" }
libc.workspace = true
object.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[dev-dependencies]
# g4's starvation share over its run: the measure xtask's cadence window is judged with (atl-cpu-pressure)
atl-cpu-pressure = { path = "../atl-cpu-pressure" }

[lints]
workspace = true
