# SPDX-License-Identifier: MIT
[package]
name = "atl-native-bridge"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `libatl_native_bridge.so`: the NativeBridge core ART loads with `-XX:NativeBridge=libatl_native_bridge.so` (libnativebridge `LoadNativeBridge`: a plain file name, opened by `dlopen` through LD_LIBRARY_PATH, then `dlsym("NativeBridgeItf")`).
# Boundary crate: `unsafe` only in `exports` (the C ABI and raw pointer conversion), the generated shells and `engine` (mapping, the crossing asm, guest calls); ELF classification (`elf`) is safe.
[lib]
crate-type = ["cdylib", "rlib"]

# spike gates g1-g4 (bridge-1 route N), harness-less (main thread only, no runner threads touching TLS); env in tests/common/mod.rs, stages needing a native-bridge build skip without one
# g1: guest linker init through the crossing, host intact after
[[test]]
name = "g1"
harness = false

# g2: guest dlopen of an NDK app library + native calls (TLS, errno, C++ throw, nested dlopen)
[[test]]
name = "g2"
harness = false

# g3: SIGSEGV in guest code reaches the host handler on host FS and resumes on guest FS
[[test]]
name = "g3"
harness = false

# g4: crossing cost, guest->host and host->guest, 10 runs
[[test]]
name = "g4"
harness = false

[dependencies]
libc.workspace = true
object.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
