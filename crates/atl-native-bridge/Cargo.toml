# SPDX-License-Identifier: MIT
[package]
name = "atl-native-bridge"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `libatl_native_bridge.so`: the NativeBridge core ART loads with `-XX:NativeBridge=libatl_native_bridge.so` (libnativebridge `LoadNativeBridge`: a plain file name, opened by `dlopen` through LD_LIBRARY_PATH, then `dlsym("NativeBridgeItf")`).
# Boundary crate: `unsafe` only in `exports` (the C ABI and raw pointer conversion) and the generated shells; ELF classification (`elf`) is safe.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
object.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
