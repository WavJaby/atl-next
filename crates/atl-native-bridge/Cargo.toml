# SPDX-License-Identifier: MIT
[package]
name = "atl-native-bridge"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `libatl_native_bridge.so`: the NativeBridge core ART loads with `-XX:NativeBridge=libatl_native_bridge.so` (libnativebridge `LoadNativeBridge`: a plain file name, opened by `dlopen` through LD_LIBRARY_PATH, then `dlsym("NativeBridgeItf")`).
# Boundary crate: `unsafe` only in `exports` (the C ABI and raw pointer conversion), the generated shells and `engine` (mapping, the crossing asm, guest calls); ELF classification (`elf`) is safe.
[lib]
crate-type = ["cdylib", "rlib"]

# Q5-8 crossing counter (QEMU bridge plan section 5; counters.rs): compiled out of shipped builds, so the library has no counter symbol without it. Counts QEMU binding crossings per host target and the memcpy/memset/memcmp sizes; gate `xtask test crossing`.
[features]
crossing-count = []

# Both engines are in every build, one chosen per process at NB `initialize` (engine/mod.rs `Active`). The QEMU engine is the engine `.so` behind its C ABI (atl-engine-api), dlopened at run time: no cargo edge to the QEMU engine crate.

# spike gates g1-g4 (bridge-1 route N), harness-less (main thread only, no runner threads touching TLS); env in tests/common/mod.rs, stages needing a native-bridge build skip without one
# g1: guest linker init through the crossing, host intact after
[[test]]
name = "g1"
harness = false

# g2: guest dlopen of an NDK app library + native calls (TLS, errno, C++ throw, nested dlopen)
[[test]]
name = "g2"
harness = false

# g3: SIGSEGV in guest code reaches the host handler on host FS and resumes on guest FS
[[test]]
name = "g3"
harness = false

# g4: crossing cost, guest->host and host->guest, 10 runs
[[test]]
name = "g4"
harness = false

# g5: the signal entry's last-chance report fires when no host thread pointer is found (fake TCB on FS), host handler still runs
[[test]]
name = "g5"
harness = false

# Q4-3 gate: the six NB entries placed in place on the real arm64 linker64 and vdso, the pages registered with QEMU, a guest calls each site (QEMU bridge plan Q4-3); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO)
[[test]]
name = "qemu_linker"
harness = false

# Q4-4 gate: the real arm64 guest linker's __linker_init runs under QEMU from a BOOT trap and returns the main executable's entry (QEMU bridge plan Q4-4); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO)
[[test]]
name = "qemu_start"
harness = false

# Q6-5 gate: the QEMU engine booted through its installed paths (atl-android-paths engine_library / engine_boot) in a staged image, as `select` boots it; needs the staged /system (ATL_NB_STAGED, xtask qemu_linker.rs)
[[test]]
name = "qemu_staged"
harness = false

# Q4-5 gate: a guest dlopen under QEMU: the main executable's dlopen loads a library whose DT_NEEDED is another, the stub libc intercepts (QEMU bridge plan Q4-5); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO)
[[test]]
name = "qemu_dlopen"
harness = false

# Q5-6 gate: guest threads under QEMU: a guest pthread_create attaches its own engine CPU, the provider's foreach reaches a guest callback, a guest key destructor runs at thread exit (QEMU bridge plan Q5-6); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO)
[[test]]
name = "qemu_thread"
harness = false

# Q6-2 gate: guest JNI calls under QEMU, integer lanes: the fixture's JNI calls reach a fake host JNIEnv, GetJavaVM (a special) routes to its own thunk (QEMU bridge plan Q6-2); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO)
[[test]]
name = "qemu_jni"
harness = false

# Q6-1 gate: the engine ABI, trap side: a guest host call's integer lanes, FP lanes and stack words reach the host, and the host's FP answer returns in v0 (QEMU bridge plan Q6-1); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO) and the static fixture (ATL_QEMU_ABI_FIXTURE)
[[test]]
name = "qemu_abi"
harness = false

# Q7-4 gate: GLES2 proxy calls under QEMU: fp arguments, a ninth (stack) argument and an fp result reach a host recorder bit for bit, bound by the QEMU table's rows (QEMU bridge plan Q7-4); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO) and the static fixture (ATL_QEMU_GL_FIXTURE)
[[test]]
name = "qemu_gl"
harness = false

# Q5-8 gate: the crossing counter under QEMU: a fixture's N calls per binding count N, sizes fall in their literal bins, 2^16 crossings dump once (QEMU bridge plan Q5-8); selects the QEMU engine, needs the engine `.so` (ATL_ENGINE_SO) and feature `crossing-count`
[[test]]
name = "qemu_crossing"
harness = false
required-features = ["crossing-count"]

# Q5-8b gate: the crossing counter on the identity side: thunk and JNI shell crossings counted exactly per host target, 2^16 crossings dump once (QEMU bridge plan Q5-8b); needs feature `crossing-count`
[[test]]
name = "identity_crossing"
harness = false
required-features = ["crossing-count"]

# opensl-es plan O1 gate `sles-bridge`: an NDK fixture against the recorder below through the identity engine; checks a-g; run under bwrap by `xtask test sles-bridge`
[[test]]
name = "sles_bridge"
harness = false

# the host recorder `libOpenSLES.so` of `sles_bridge` (test library, never staged by `xtask native`)
[[example]]
name = "sles_recorder"
crate-type = ["cdylib"]

[dependencies]
atl-android-paths = { path = "../atl-android-paths" }
atl-engine-api = { path = "../atl-engine-api" }
libc.workspace = true
object.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[dev-dependencies]
# g4's starvation share over its run: the measure xtask's cadence window is judged with (atl-cpu-pressure)
atl-cpu-pressure = { path = "../atl-cpu-pressure" }

[lints]
workspace = true
