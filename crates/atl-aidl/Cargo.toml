# SPDX-License-Identifier: MIT
[package]
name = "atl-aidl"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The stubs: the converter's AIDL crate `atl_aidl_stubs` over libbinder's `libbinder_aidl` filegroup (IServiceManager and what it imports; xtask packages.rs `aidl`), against libbinder_rs (AOSP's Rust binder: libbinder_ndk -> libbinder), which the probe also names.
# Only `xtask native` builds them: it builds this package after the converter with feature `converter` (atl-bridgegen converter.rs).
# Plain workspace builds and tests take the empty library and skip the probe.
[package.metadata.atl]
converter = ["device/libbinder_rs"]
aidl = [":libbinder_aidl"]

[features]
converter = []

# Links the converter's binder and round-trips an AIDL parcelable through AOSP's C++ Parcel.
[[bin]]
name = "atl-aidl-probe"
path = "src/bin/probe.rs"
required-features = ["converter"]

[dependencies]
anyhow.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
