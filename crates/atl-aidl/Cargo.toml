# SPDX-License-Identifier: MIT
[package]
name = "atl-aidl"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The stubs: the converter's AIDL crate `atl_aidl_stubs` (xtask packages.rs `aidl`, bp2ninja aidlcrates.go) against libbinder_rs (AOSP's Rust binder: libbinder_ndk -> libbinder), which the probe also names.
# Only `xtask native` builds them: it builds this package after the converter with feature `converter` (atl-bridgegen converter.rs).
# Plain workspace builds and tests take the empty library and skip the probe.
# `android.hardware.graphics.allocator-V2-rust` is AOSP's own Rust backend of the stable HAL interface (stability vintf, frozen at V2 = its current sources): an unstable crate cannot compile @VintfStability types (aidl.cpp), so it is not one of the crate's `types`.
[package.metadata.atl]
converter = ["device/libbinder_rs", "device/libatl_diag", "device/libatl_parcelables", "device/android.hardware.graphics.allocator-V2-rust"]

# types: IServiceManager (libbinder's own AIDL), the M2 framework interfaces, and the M3 window path (IWindowManager, IWindowSession, IWindow, IDisplayManager; libgui's `android.gui` ISurfaceComposer and its client / display-event interfaces), IInputMethodManager (the input method service, input_method.rs), IInputMethod / IInputMethodSession / IInputMethodSessionCallback (the in-app input method atl-ime serves and IMMS-lite binds, ime_bind.rs), IAndroidFuture (the getSurroundingText result atl-ime receives), IInputManager (the input service, input.rs), IStorageManager (the mount service, storage.rs; its IVoldTaskListener import is in system/vold/binder), IClipboard (the clipboard service, clipboard.rs), compiled with their import closure.
# A type another aidl_interface owns is imported at its latest frozen version, not compiled (bp2ninja aidlcrates.go): android.hardware.graphics.common (DisplayDecorationSupport, ...) is `android.hardware.graphics.common-V6-rust`. The interfaces owning a requested type are stood in for: `android.gui` brings its rust backend's `libgui_aidl_types_rs` (BitTube, LayerMetadata, VsyncEventData, ... as `todo!()` stubs).
# Interfaces with @EnforcePermission methods (IPackageManager, IActivityManager, ...) get a required `enforce_permission` hook (patches/aosp/system/tools/aidl): their services must implement it.
# include_dirs: libbinder's AIDL root, then frameworks/base's `framework-aidl-export-defaults` aidl.export_include_dirs (Android.bp) in its order, then frameworks/native/aidl/binder (PersistableBundle, which framework AIDL imports),
# frameworks/native/aidl/gui (android.view.Surface, whose rust_type is the tree's `nativewindow` crate), libgui's own `android.gui` include_dirs (libs/gui/aidl/Android.bp), and the HAL interface roots the framework AIDL imports (graphics/common).
# parcelables: Rust types of every unstructured parcelable and Java-only builtin (atl-parcelables).
[package.metadata.atl.aidl]
include_dirs = [
    "frameworks/native/libs/binder/aidl",
    "frameworks/base/core/java",
    "frameworks/base/drm/java",
    # framework-jobscheduler's aidl export (apex/jobscheduler/framework/Android.bp): IAlarmManager, AlarmManager, IAlarmListener
    "frameworks/base/apex/jobscheduler/framework/java",
    "frameworks/base/graphics/java",
    "frameworks/base/identity/java",
    "frameworks/base/keystore/java",
    "frameworks/base/media/java",
    "frameworks/base/media/mca/effect/java",
    "frameworks/base/media/mca/filterfw/java",
    "frameworks/base/media/mca/filterpacks/java",
    "frameworks/base/mms/java",
    "frameworks/base/opengl/java",
    "frameworks/base/rs/java",
    "frameworks/base/sax/java",
    "frameworks/base/telecomm/java",
    "frameworks/base/telephony/java",
    "frameworks/native/aidl/binder",
    "frameworks/native/aidl/gui",
    "frameworks/native/libs/gui/aidl",
    "frameworks/native/libs/gui",
    "hardware/interfaces/graphics/common/aidl",
    "frameworks/av/aidl",
    "packages/modules/Bluetooth/framework/aidl-export",
    "packages/modules/Connectivity/framework/aidl-export",
    "packages/modules/Connectivity/framework/src",
    # IPermissionManager imports the structured AttributionSourceState
    "frameworks/native/libs/permission/aidl",
    "system/hardware/interfaces/media/aidl",
    "system/vold/binder",
]
types = [
    "android.hardware.display.IDisplayManager",
    "android.view.IWindowManager",
    "android.view.IWindowSession",
    "android.view.IWindow",
    "android.gui.ISurfaceComposer",
    "android.gui.ISurfaceComposerClient",
    "android.gui.IDisplayEventConnection",
    "android.os.IServiceManager",
    "android.os.IUserManager",
    # the processinfo service (process_info.rs): libmedia ProcessInfo asks it for a client's priority
    "android.os.IProcessInfoService",
    "android.os.storage.IStorageManager",
    "android.content.IClipboard",
    # the alarm service (alarm.rs)
    "android.app.IAlarmManager",
    # the activity service's PendingIntent records (pending_intent.rs): BnIntentSender
    "android.content.IIntentSender",
    # the connectivity service (connectivity.rs) and the client Messenger its network callbacks go to
    "android.net.IConnectivityManager",
    "android.os.IMessenger",
    # the power service and the thermalservice PowerManager needs beside it (power.rs)
    "android.os.IPowerManager",
    "android.os.IThermalService",
    # the uimode service (uimode.rs)
    "android.app.IUiModeManager",
    # the permissionmgr service (permission_manager.rs)
    "android.permission.IPermissionManager",
    "android.app.IApplicationThread",
    "android.app.IActivityManager",
    "android.app.IActivityTaskManager",
    "android.content.pm.IPackageManager",
    "android.content.IContentService",
    "android.media.IAudioService",
    "android.app.IActivityClientController",
    "android.app.IRequestFinishCallback",
    "com.android.internal.view.IInputMethodManager",
    "com.android.internal.inputmethod.IInputMethod",
    "com.android.internal.inputmethod.IInputMethodSession",
    "com.android.internal.inputmethod.IInputMethodSessionCallback",
    "com.android.internal.infra.IAndroidFuture",
    "android.app.INotificationManager",
    "android.app.ITransientNotification",
    "android.hardware.input.IInputManager",
    # test only (atl-aidl-probe --enforce): the smallest framework interface with @EnforcePermission methods
    "android.hardware.ISerialManager",
]
parcelables = "atl-parcelables"
# every non-OK reply a served interface sends is counted once (aidl patch --rust_reply_hook); methods a service does not implement answer UNKNOWN_TRANSACTION
reply_hook = { package = "atl-diag", path = "atl_diag::binder_reply" }

[features]
converter = []

# Links the converter's binder and round-trips an AIDL parcelable through AOSP's C++ Parcel.
[[bin]]
name = "atl-aidl-probe"
path = "src/bin/probe.rs"
required-features = ["converter"]

[dependencies]
anyhow.workspace = true

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
