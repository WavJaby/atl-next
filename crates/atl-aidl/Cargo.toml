# SPDX-License-Identifier: MIT
[package]
name = "atl-aidl"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The stubs need the converter's libbinder_rs (AOSP's Rust binder: libbinder_ndk -> libbinder) and host aidl, which only `xtask native` builds: it builds this package after the converter with feature `converter` (atl-bridgegen converter.rs).
# Plain workspace builds and tests take the empty library and skip the probe.
[package.metadata.atl]
converter = ["device/libbinder_rs"]

[features]
converter = ["dep:async-trait"]

# Links the converter's binder and round-trips an AIDL parcelable through AOSP's C++ Parcel.
[[bin]]
name = "atl-aidl-probe"
path = "src/bin/probe.rs"
required-features = ["converter"]

[dependencies]
anyhow.workspace = true
# the stubs' `#[::async_trait::async_trait]` (aidl generate_rust.cpp; Soong adds libasync_trait to every aidl Rust crate, bp2ninja rustsrc.go rustAidl.deps)
async-trait = { workspace = true, optional = true }

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

[lints]
workspace = true
