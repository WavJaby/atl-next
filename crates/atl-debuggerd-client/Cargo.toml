# SPDX-License-Identifier: MIT
[package]
name = "atl-debuggerd-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# cargo-c builds with it; nothing is gated on it
capi = []

[build-dependencies]
anyhow.workspace = true
atl-bridgegen = { path = "../atl-bridgegen" }

# cargo-c: the shared library dependents link for libdebuggerd_client. Its C header is generated by
# build.rs (atl-bridgegen from AOSP's debuggerd/client.h), not by cbindgen, and installs at the include root.
[package.metadata.capi.header]
generation = false
subdirectory = false

[lints]
workspace = true
