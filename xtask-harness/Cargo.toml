# SPDX-License-Identifier: MIT
[package]
name = "xtask-harness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
atl-android-paths = { path = "../crates/atl-android-paths" }
atl-bridgegen = { path = "../crates/atl-bridgegen" }
atl-broker = { path = "../crates/atl-broker" }
atl-bwrap = { path = "../crates/atl-bwrap" }
atl-fonts = { path = "../crates/atl-fonts" }
atl-fonts-table = { path = "../crates/atl-fonts-table" }
atl-gralloc = { path = "../crates/atl-gralloc" }
atl-host-load = { path = "../crates/atl-host-load", features = ["serde"] }
atl-layout = { path = "../crates/atl-layout" }
atl-native-bridge = { path = "../crates/atl-native-bridge" }
atl-sigaction-hook = { path = "../crates/atl-sigaction-hook" }
atl-platform-host = { path = "../crates/atl-platform-host" }
atl-property-service = { path = "../crates/atl-property-service" }
atl-sepolicy = { path = "../crates/atl-sepolicy" }
atl-diag = { path = "../crates/atl-diag", features = ["serde"] }
atl-services-types = { path = "../crates/atl-services-types" }
# the labwc setup of every headless labwc (local gates; the remote helper is the same library): nested_wayland.rs
atl-labwc-setup = { path = "../crates/atl-labwc-setup" }
# the test environment's Wayland wire client: nested_wayland.rs, wayland_proxy.rs
atl-wayland-wire = { path = "../crates/atl-wayland-wire" }
clap.workspace = true
object.workspace = true
png.workspace = true
read-fonts.workspace = true
roxmltree.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
xtask = { path = "../xtask" }
# the notification gate's fake desktop service on a private bus (session_bus.rs); `service` = the interface macro
zbus = { workspace = true, features = ["service"] }
zip.workspace = true

[dev-dependencies]
atl-exec-fixture = { path = "../crates/atl-exec-fixture" }

[lints]
workspace = true
