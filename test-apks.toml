# The test APKs `xtask run-apk <row>` runs: pinned official builds, never built here. A row's file is downloaded once into <workspace>/cache/test-apks/<sha256>.apk; every use re-verifies it, so a damaged or swapped file is refused by name, never run.
#
# Row key: the name `xtask run-apk` takes (lowercase letters, digits, `-`).
# Fields, all required:
#   package       application id. run-apk checks it against the APK's own manifest.
#   version_name  the APK's own versionName: run-apk checks it against the manifest. A github-release url's tag need not equal it.
#   version_code  integer. run-apk checks it against the manifest. fdroid: the url's file name must be `<package>_<version_code>.apk`.
#   url           https. fdroid: https://f-droid.org/repo/<package>_<version_code>.apk. github-release: https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>.apk
#   sha256        64 lowercase hex digits of the downloaded file. Checked at download and at every use of the cache.
#   size          bytes of the downloaded file. Same.
#   signer_sha256 64 lowercase hex digits of the signing certificate's SHA-256: the first certificate of the first signer of the v2 signing block (v3 when there is no v2), apksigner's `Signer #1 certificate SHA-256 digest`. Same.
#   source        fdroid | github-release. Fixes the shape of the url.
# `cargo xtask check` (step tables) checks the schema and the url and file-name invariants. The content fields are checked against the file itself: `xtask fetch --test-apks --execute` downloads and verifies every row, `xtask run-apk` verifies the row it runs. A mismatch refuses the row and names the field.
# Rows are added when a gate first needs them.

# fdroid rows: signed with Fossify's key (CN=Naveen Singh), the signer the measured builds carry
[fossify-math]
package = "org.fossify.math"
version_name = "1.4.0"
