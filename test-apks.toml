# The test APKs `xtask run-apk <row>` runs: pinned official builds, never built here. A url row's file is downloaded once into <workspace>/cache/test-apks/<sha256>.apk; a google-play row's files are fetched by apkeep (`xtask fetch --test-apks --play --play-email <addr> --execute`) into the same cache, one file per sha256. Every use re-verifies the files, so a damaged or swapped file is refused by name, never run.
#
# Row key: the name `xtask run-apk` takes (lowercase letters, digits, `-`).
# Fields, all required unless marked:
#   package       application id. run-apk checks it against the APK's own manifest.
#   version_name  the APK's own versionName: run-apk checks it against the manifest. A github-release url's tag need not equal it.
#   version_code  integer. run-apk checks it against the manifest. fdroid: the url's file name must be `<package>_<version_code>.apk`.
#   signer_sha256 64 lowercase hex digits of the signing certificate's SHA-256: the first certificate of the first signer of the v2 signing block (v3 when there is no v2), apksigner's `Signer #1 certificate SHA-256 digest`. Checked against every file of the row.
#   source        fdroid | github-release | google-play. Decides the other fields.
# url rows (fdroid, github-release):
#   url           https. fdroid: https://f-droid.org/repo/<package>_<version_code>.apk. github-release: https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>.apk
#   sha256        64 lowercase hex digits of the downloaded file. Checked at download and at every use of the cache.
#   size          bytes of the downloaded file. Same.
# google-play rows (no url, sha256 or size):
#   device        apkeep's device profile (`-o device=`), e.g. px_9a: Play serves each device its own splits. Checked by the fetch: another device's splits fail the pins.
#   files         the base (`name = "base"`) and each split, as `{ name, sha256, size }`. Each is pinned like a url row's file. apkeep names them `<package>.apk` (base) and `<package>.<name>.apk`.
# `cargo xtask check` (step tables) checks the schema and the url and file-name invariants. The content fields are checked against the files themselves: `xtask fetch --test-apks --execute` downloads and verifies every row, `xtask run-apk` verifies the row it runs. A mismatch refuses the row and names the file and the field.
# Rows are added when a gate first needs them.

