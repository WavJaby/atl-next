# Android path literals allowed outside crate atl-android-paths (xtask check step android-paths; xtask/src/android_paths.rs).
# One [[allow]] row per (file, literal): `literal` as written between the quotes, `reason` why the layout module is not the source.
# A row matching nothing fails the step.

[[allow]]
file = "crates/atl-services/src/storage.rs"
literal = "/storage/emulated/0"
reason = "test's expected value, from StorageManager's emulated primary path, independent of the constant under test"

[[allow]]
file = "crates/atl-bionic/src/progname.rs"
literal = "/system/bin/app_process64"
reason = "test input of the basename parser: any absolute path serves; no layout owns app_process"

[[allow]]
file = "crates/atl-native-bridge/src/exports.rs"
literal = "/data/app/lib/x86_64/libatl-jni-test.so"
reason = "test input of the native bridge's path classifier: a library path as libnativeloader passes one, never opened"

[[allow]]
file = "xtask-harness/src/adb.rs"
literal = "/product/bin:/apex/com.android.runtime/bin:/apex/com.android.art/bin:/system_ext/bin:/system/bin:/system/xbin:/odm/bin:/vendor/bin:/vendor/xbin"
reason = "init's PATH quoted from init.environ.rc.in: the shell's search order, a device value no layout constant composes"

[[allow]]
file = "xtask/src/host_disk.rs"
literal = "/mnt"
reason = "WSL's host-drive mount root (automount.root default), a Linux host path, not an Android one"

[[allow]]
file = "xtask/src/host_disk.rs"
literal = "/mnt/c/WSL/Debian/ext4.vhdx"
reason = "WSL vhdx path under the host-drive mount as the test's expected value"

[[allow]]
file = "xtask/src/host_disk.rs"
literal = "/mnt/c"
reason = "WSL host-drive mount as the test's expected value and input"

[[allow]]
file = "xtask/src/host_disk.rs"
literal = "/mnt/d"
reason = "WSL host-drive mount as the test's expected value"
