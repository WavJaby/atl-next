# SPDX-License-Identifier: MIT
# cargo-deny policy for every crate we link. Crate licences only; the licence gate for upstream C/C++
# sources is a separate xtask step.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Only what the current dependency graph needs. A new licence is a deliberate addition checked
# against the licence rules: no GPL-3 linked into the runtime; no GPL-2.0-only without a linking
# exception anywhere.
# Zlib: already on licenses.toml's runtime list (owner, 2026-10-31); cxx >= 1.0.190 links it into atl-services through foldhash.
# ISC: already on licenses.toml's runtime list (owner, 2026-10-31); fontconfig's sys crate links libloading (ISC) through dlib, without its dlopen feature too.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "ISC"]
confidence-threshold = 0.93
# A licence outside `allow` for one crate that is never linked into an artifact: gtk4-rs's build scripts (system-deps -> cfg-expr -> target-lexicon) run at build time only. `Apache-2.0 WITH LLVM-exception` is Apache-2.0 plus a permission to omit its notices from compiled output, and is GPL-3-compatible, so it would be safe in the runtime too; it stays out of `allow` (and out of licenses.toml's runtime list) until a linked crate needs it.
exceptions = [
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # build-time only: bindgen generates pipewire-sys's bindings (libspa-sys build dependency); nothing it produces links a licence it adds
    { crate = "bindgen", allow = ["BSD-3-Clause"] },
]

[bans]
# one version of each crate in the graph
multiple-versions = "deny"
wildcards = "deny"
# Exact-version skips only. cargo-deny `skip` takes no `wrappers`; the version pin is the narrowest scope.
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "xtask only: png 0.18 pins miniz_oxide 0.8 for decoding, flate2 (zip) is on 0.9; never linked into a shipped artifact" },
    { crate = "syn@2.0.119", reason = "build-time only: proc-macro dep of enumflags2_derive 0.7.12 <- enumflags2 <- landlock 0.4.7 (approved safe Landlock binding; own syscalls would be a second, unsafe copy). Delete when enumflags2_derive moves to syn 3." },
    { crate = "nom@7.1.3", reason = "build-time only: cexpr <- bindgen 0.72 (pipewire-sys bindings via libspa-sys) needs nom 7; libspa needs nom 8 at run time. Delete when bindgen moves to nom 8." },
    { crate = "shlex@1.3.0", reason = "build-time only: bindgen 0.72 (pipewire-sys bindings via libspa-sys) needs shlex 1; the rest of the graph is on shlex 2. Delete when bindgen moves to shlex 2." },
    { crate = "unicode-width@0.2.3", reason = "build-time only: annotate-snippets (bindgen 0.72's diagnostics) needs unicode-width 0.2; cxx-build needs 0.1. Delete when bindgen or cxx-build move to the other major." },
    { crate = "system-deps@7.0.8", reason = "build-time only: pipewire-sys and libspa build scripts resolve libpipewire through system-deps 7; gtk4's build scripts use 9. Delete when pipewire-sys moves to system-deps 9." },
]
allow-wildcard-paths = true
# Host toolkit / desktop-bus crates are reachable only through the platform layer: core crates depend
# on the `atl-platform-*` facades. When a `-<os>` implementation crate is created, it is added to the
# matching entry's `wrappers` -- the only crates allowed to depend on it directly.
# GTK: only atl-platform-ui-linux and atl-platform-host-linux depend on gtk4; the other gtk-rs crates are listed with the gtk-rs crates that depend on them (the bindings' own layering), so a workspace crate reaching for gdk4 or gsk4 directly still fails.
deny = [
    { crate = "fontconfig", reason = "platform layer only: the desktop's fonts reach atld through FontSource", wrappers = ["atl-platform-host-linux"] },
    { crate = "gtk4", reason = "platform layer only", wrappers = ["atl-platform-ui-linux", "atl-platform-host-linux"] },
    { crate = "gtk4-sys", reason = "platform layer only", wrappers = ["gtk4"] },
    { crate = "gdk4", reason = "platform layer only", wrappers = ["gtk4", "gsk4", "gdk4-wayland"] },
    { crate = "gdk4-sys", reason = "platform layer only", wrappers = ["gdk4", "gsk4-sys", "gtk4-sys", "gdk4-wayland-sys"] },
    { crate = "gsk4", reason = "platform layer only", wrappers = ["gtk4"] },
    { crate = "gsk4-sys", reason = "platform layer only", wrappers = ["gsk4", "gtk4-sys"] },
    { crate = "pipewire", reason = "platform layer only", wrappers = ["atl-platform-ui-linux"] },
    { crate = "pipewire-sys", reason = "platform layer only", wrappers = ["pipewire"] },
    { crate = "libspa", reason = "platform layer only", wrappers = ["pipewire"] },
    { crate = "libspa-sys", reason = "platform layer only", wrappers = ["libspa", "pipewire", "pipewire-sys"] },
    { crate = "gdk4-wayland", reason = "platform layer only", wrappers = ["atl-platform-ui-linux"] },
    { crate = "gdk4-wayland-sys", reason = "platform layer only", wrappers = ["gdk4-wayland"] },
    { crate = "wayland-client", reason = "platform layer only", wrappers = ["atl-platform-ui-linux"] },
    { crate = "wayland-backend", reason = "platform layer only", wrappers = ["wayland-client"] },
    { crate = "wayland-sys", reason = "platform layer only", wrappers = ["wayland-backend"] },
    { crate = "zbus", reason = "platform layer only" },
    { crate = "ashpd", reason = "platform layer only" },
    { crate = "windows", reason = "platform layer only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
