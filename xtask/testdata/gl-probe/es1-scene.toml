# ES1 scene of `xtask test app`'s guest GLES1 fixture: the one description. Read by xtask/src/gl_scene.rs (program and reference expectation) and jni_fixture.rs (the fixture's C).
# A step's text is one GL call by name, without the GL_ prefix; colours are 0-255 ints, geometry is GL units. The steps run in order on both paths.
# Vocabulary: clear R G B A | color R G B A | enable|disable SCISSOR_TEST|BLEND|TEXTURE_2D | client_enable|client_disable VERTEX_ARRAY|COLOR_ARRAY|TEXTURE_COORD_ARRAY|POINT_SIZE_ARRAY_OES | scissor X Y W H | matrix MODELVIEW|PROJECTION | load_identity | ortho L R B T N F | push | pop | translate X Y Z | rotate A X Y Z | scale X Y Z | vertices X Y ... | colors R G B A ... | texcoords S T ... | point_sizes S ... | elements I ... (triangles, u16) | points FIRST COUNT | blend_func SRC DST | bind_texture N | texture W H R G B A ... (RGBA8) | texture_filter NEAREST | read W H
# Deliberate break (jni_fixture.rs `es1` break): a step with `break = true` is dropped from the broken run (skip glPopMatrix and the GL_COLOR_ARRAY enable); the readback must then mismatch.

[surface]
width = 64
height = 64

# Background B (30 60 200) everywhere; A (200 30 40) left of x = 32 via the scissored clear.
[[step]]
text = "clear 30 60 200 255"

[[step]]
text = "enable SCISSOR_TEST"

[[step]]
text = "scissor 0 0 32 64"

[[step]]
text = "clear 200 30 40 255"

[[step]]
text = "disable SCISSOR_TEST"

[[step]]
text = "matrix PROJECTION"

[[step]]
text = "load_identity"

[[step]]
text = "ortho 0 64 0 64 -1 1"

[[step]]
text = "matrix MODELVIEW"

[[step]]
text = "load_identity"

# Q1: client arrays, flat colour C (16 200 90) on [8,24)^2.
[[step]]
text = "client_enable VERTEX_ARRAY"

[[step]]
text = "client_enable COLOR_ARRAY"
break = true

[[step]]
text = "vertices 8 8 24 8 24 24 8 24"

[[step]]
text = "colors 16 200 90 255 16 200 90 255 16 200 90 255 16 200 90 255"

[[step]]
text = "elements 0 1 2 0 2 3"

# Matrix stack: the rect [0,4]x[0,2] lands on [30,32)x[32,40) (translate 32 32, rotate 90, scale 2 1 1), colour M (250 150 20); then pop.
[[step]]
text = "push"

[[step]]
text = "translate 32 32 0"

[[step]]
text = "rotate 90 0 0 1"

[[step]]
text = "scale 2 1 1"

[[step]]
text = "vertices 0 0 4 0 4 2 0 2"

[[step]]
text = "colors 250 150 20 255 250 150 20 255 250 150 20 255 250 150 20 255"

[[step]]
text = "elements 0 1 2 0 2 3"

[[step]]
text = "pop"
break = true

# Untransformed quad D (120 40 230) on [40,48)x[8,16): a missing pop moves it.
[[step]]
text = "vertices 40 8 48 8 48 16 40 16"

[[step]]
text = "colors 120 40 230 255 120 40 230 255 120 40 230 255 120 40 230 255"

[[step]]
text = "elements 0 1 2 0 2 3"

# Texture quad on [40,56)^2: 2x2 RGBA, NEAREST, one 8x8 quadrant per texel (row 0 is t in [0,0.5)): red, green / blue, yellow.
[[step]]
text = "client_enable TEXTURE_COORD_ARRAY"

[[step]]
text = "texcoords 0 0 1 0 1 1 0 1"

[[step]]
text = "client_disable COLOR_ARRAY"

[[step]]
text = "color 255 255 255 255"

[[step]]
text = "enable TEXTURE_2D"

[[step]]
text = "bind_texture 1"

[[step]]
text = "texture 2 2 255 0 0 255 0 255 0 255 0 0 255 255 255 255 0 255"

[[step]]
text = "texture_filter NEAREST"

[[step]]
text = "vertices 40 40 56 40 56 56 40 56"

[[step]]
text = "elements 0 1 2 0 2 3"

[[step]]
text = "disable TEXTURE_2D"

[[step]]
text = "client_disable TEXTURE_COORD_ARRAY"

# Blend: colour S (0 255 0) with alpha 128 over A on [2,28)x[40,56) (SRC_ALPHA, ONE_MINUS_SRC_ALPHA).
[[step]]
text = "vertices 2 40 28 40 28 56 2 56"

[[step]]
text = "color 0 255 0 128"

[[step]]
text = "enable BLEND"

[[step]]
text = "blend_func SRC_ALPHA ONE_MINUS_SRC_ALPHA"

[[step]]
text = "elements 0 1 2 0 2 3"

[[step]]
text = "disable BLEND"

# Point at (12,52), size 4, non-AA: the square [10,14)x[50,54), colour white.
[[step]]
text = "vertices 12 52"

[[step]]
text = "client_enable POINT_SIZE_ARRAY_OES"

[[step]]
text = "point_sizes 4"

[[step]]
text = "color 255 255 255 255"

[[step]]
text = "points 0 1"

[[step]]
text = "client_disable POINT_SIZE_ARRAY_OES"

[[step]]
text = "read 64 64"
