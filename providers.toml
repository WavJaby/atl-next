# Android.bp modules of the host build that are not built from AOSP source as their Android.bp says: who provides them instead, or (`rust_os`) the OS a device Rust crate is built for, or (`defines`) the macros a patched module is compiled with. Unlisted modules are built from AOSP source by the converter.
# Guest-side libraries (guest bionic, thunks) are the bridge's concern, not this table's.
#
# Row key: Android.bp module name (the converter fails on a key that names no module in the fetched tree; a `module:` row's key may be absent, its stand-in's installed name must equal it).
#   provider  crate:<workspace crate>   our Rust crate, built with cargo-c into the prefix
#             upstream:<sources.toml>   a git upstream built by its own build system into <out>/upstream/<name>/prefix by `xtask native`, before the converter; xtask holds its build recipe (upstream.rs), which must list the module
#             system:<deps.toml row>    a host system library, linked as installed; the row needs `pkgconfig` and `used_by` containing `upstream:aosp`. `xtask native` resolves it with pkg-config (system.rs): its one `-l` library found in its `-L` dirs then its `libdir` (`lib<name>.so`), its `-I` dirs, its `-D` defines; anything else fails the run. On a cross host it resolves in that host's sysroot (pkg-config reads the target's .pc files only), never the build machine's
#             module:<Android.bp module> another tree module, built wherever this one is named; the only provider, no `srcs`. The converter fails unless it exists and installs under this row's key (its stem + suffix)
#             none                      nothing on this host: a dependency on it is dropped (the module's API has no meaning on a glibc desktop, or the system C library covers it)
#   reason    why AOSP's own module is not used (on a `rust_os` row: why the crate needs its Android behaviour here; on a `defines` row: what the macros switch and why)
#   rust_os   instead of `provider` and `srcs`: "android", the only value; the tree builds the module, its device variant taking the Android.bp `target` blocks of android (not linux_glibc, every other Rust crate's: rustc compiles for the host triple) and `--cfg atl_android_userspace`,
#             which the crate's patch in patches/aosp adds to exactly the `target_os = "android"` gates whose Android behaviour this runtime provides (system properties from atl-bionic, liblog). The converter fails unless the module is a Rust module with a device variant.
#   defines   instead of `provider` and `srcs`: macros (`NAME` or `NAME=VALUE`) the module's device C/C++ compiles get as -D, after the device defines; the tree builds it otherwise as its Android.bp says. Each must be read by an added line of a patch under patches/ (`xtask check` step tables fails otherwise),
#             which switches exactly the code whose Android behaviour this host cannot have. The converter fails unless the module is a C/C++ module with a device variant.
#   srcs      optional: only these sources of the module (paths relative to its directory, as its Android.bp writes them; no globs) are replaced, the rest is still built from AOSP source. `none` drops them; any other provider is linked into the module first, for their symbols.
#             The converter fails when a listed file is not one of the module's sources at the pin (where the goals build it; elsewhere, when the file does not exist).
# Artifacts are not listed: they follow from the provider (cargo-c output, the upstream recipe's install, pkg-config).
# `crate:`, `upstream:` and `system:` modules are provided: `xtask native` builds or resolves each provider once, before the converter, and hands it one entry per module (<out>/provided.json: its provider's artifact, include dirs, defines); dependents link the artifact first (one shared by several rows, once) and get the headers as -isystem. The tree module's export_header_lib_headers still reach dependents as the tree exports them (an -I is searched before every -isystem).
# Rows are added when their provider exists, or when a build first trips over a module that must not be built.

# bionic is an android build's C library; on glibc the system's libc, kernel headers, libm and libdl take its place (its headers on the include path shadow glibc's)
["bionic_libc_platform_headers"]
provider = "none"
reason = "bionic-internal headers; the system C library replaces bionic"

["libc"]
provider = "crate:atl-bionic"
reason = "glibc is the C library; atl-bionic adds the bionic-only API (system properties, API levels, fdsan level, android_dlopen_ext and the exported-namespace lookup in one namespace, android_mallopt refusing every option), its generated headers, include wrappers giving glibc's headers bionic's include shape, substitutes for bionic-only headers that mean the same on glibc, and forwards to bionic's kernel uapi headers the distro's lack"

["libc_headers"]
provider = "none"
reason = "bionic's libc headers would shadow glibc's"

["libc_uapi_headers"]
provider = "none"
reason = "bionic's copy of the kernel uapi; the distro's kernel headers replace it, and atl-bionic (libc row) forwards to the ones only bionic carries (Android kernel features: linux/incrementalfs.h, which libincfs-utils' map_ptr.h includes under __ANDROID__)"

["libdl"]
provider = "none"
reason = "bionic; glibc's libdl, plus android_dlopen_ext from atl-bionic"

["libm"]
provider = "none"
reason = "bionic; glibc's libm"

# platform-only modules (converter measurement 2026-10-31)
["ld-android"]
provider = "none"
reason = "bionic dynamic linker stub; glibc's ld.so is the linker, the namespace API comes from atl-bionic (libdl_android row)"

["libasync_safe"]
provider = "crate:atl-bionic"
reason = "bionic-internal (defines _LIBC, glibc rejects it); atl-bionic implements the part AOSP code here calls, without allocation, logging to stderr as bionic does without logd"

["libdl_android"]
provider = "crate:atl-bionic"
reason = "bionic linker namespace API; atl-bionic implements what the closure calls (target SDK setter, exported-namespace lookup, namespace create/link) over one namespace, the process's glibc link map; our libnativeloader's namespaces plug in there"

["libseccomp_policy"]
provider = "none"
reason = "Zygote's seccomp policy; only the Zygote JNI uses it (excluded from libandroid_runtime by its srcs row); app sandboxing incl. seccomp is the broker's job (plan Q5), so it would be a second implementation"

# ART built as its Linux target (ART_TARGET_LINUX, bp2ninja artplugin.go artTargetLinux)
["art-apex-cache-info"]
provider = "none"
reason = "xsd parser of odrefresh's cache-info.xml; libart includes it (mark_compact.cc) only under ART_TARGET_ANDROID; odrefresh/artd do not run here (no boot-time dexopt)"

["heapprofd_client_api"]
provider = "none"
reason = "perfetto's heap-profiler client; libart calls it (heap.cc, javaheapsampler.cc AHeapProfile_*/AHeapInfo_*) only under ART_TARGET_ANDROID, and no perfetto traced runs here"

["libartpalette-system"]
provider = "module:libartpalette_fake"
reason = "the platform's palette (system/libartpalette, not fetched: ART's hooks into Android's platform -- thread priorities, atrace, ashmem, task profiles), which libartpalette dlopens (its android runtime_libs). ART's own fake palette (art/libartpalette system/palette_fake.cc, stem libartpalette-system) is what Soong's host ART compiles in; shipped as that library until our own palette exists (owner 2026-11-02)"

# GL: AOSP's libEGL / libGLES* fronts are built from the tree and load libGLES_atl.so as their driver (owner O1 R-A 2026-11-04, moved into G1 2026-11-06); only their GL dispatch binding differs.
["libEGL"]
defines = ["USE_SLOW_BINDING=1"]
reason = "GL dispatch through getGlThreadSpecific() -> __get_tls() (atl-bionic's per-thread slot array) instead of per-arch asm reading the thread pointer, which on glibc is glibc's TCB (patches/aosp/frameworks/native 0009 makes the macro settable, 0010 has eglGetProcAddress return the driver entry instead of the asm extension forwarders; precondition: one GL driver per process). Rung 4 because: as-is (1) the asm reads a glibc TCB field; no environment setting (2) or supplied definition (3) reaches inline asm or a hard #define. Cost: one indirect call per GL call (G1 measurement)"

["libGLESv1_CM"]
defines = ["USE_SLOW_BINDING=1"]
reason = "as libEGL: CALL_GL_API through getGlThreadSpecific() (GLES_CM/gl.cpp), not the thread-pointer asm"

["libGLESv2"]
defines = ["USE_SLOW_BINDING=1"]
reason = "as libEGL: CALL_GL_API through getGlThreadSpecific() (GLES2/gl2.cpp), not the thread-pointer asm"

["libGLESv3"]
defines = ["USE_SLOW_BINDING=1"]
reason = "as libEGL: CALL_GL_API through getGlThreadSpecific() (GLES2/gl2.cpp), not the thread-pointer asm"

# Vulkan loader: the host's (the Khronos loader), owner decision 2026-10-31; AOSP's libvulkan replaces it at G4 (O2).

["libvulkan"]
provider = "system:vulkan"
reason = "AOSP's loader finds drivers only as Android HALs (hwvulkan via hw_get_module, sphal namespace via android_dlopen_ext); desktop drivers are Khronos ICDs, found by the Khronos loader, which GTK in the same process loads too: two loaders would export the same vk* symbols into one flat namespace"

["libelf"]
provider = "system:libelf"
reason = "AOSP builds elfutils' android variant against bionic: it force-includes bionic-fixup/AndroidFixup.h (a static rawmemchr, canonicalize_file_name as a realpath macro, which breaks glibc's stdlib.h declaration under _GNU_SOURCE) and exports bionic-fixup's argp.h/libintl.h stand-ins; glibc has all of them, and the distro's libelf is the same upstream built for glibc. Its one consumer here, libbpf_minimal (libtimeinstate), uses only <libelf.h> types"

["libbinder_driver"]
provider = "crate:atl-binder-driver"
reason = "libbinder's binder driver I/O (BinderDriver.h, patches/aosp/frameworks/native 0003): the host kernel has no binder driver (CONFIG_ANDROID_BINDER_IPC unset in Debian's and WSL's kernels), so libbinder talks to binderd over its socket protocol; AOSP's own module is the kernel pass-through"

# licence: Adobe's DNG SDK carries a DNG-only (field-of-use) patent licence, which GPL-3 forbids and the GPL-3 QEMU bridge shares the process with (licenses.toml `external/dng_sdk/`); RAW/DNG is not shipped
["libdng_sdk"]
provider = "none"
reason = "Adobe DNG SDK: its patent licence is limited to reading/writing DNG (field of use), not combinable with the GPL-3 QEMU bridge in one process"

["libandroid_runtime"]
provider = "crate:atl-android-runtime"
reason = "DngCreator's JNI needs libdng_sdk (none: its licence); the Zygote JNI serves a zygote ATL v1 does not have (atld starts each app); the crate's register_* return 0 for them"
srcs = [
    "android_hardware_camera2_DngCreator.cpp",
    "com_android_internal_os_Zygote.cpp",
    "com_android_internal_os_ZygoteCommandBuffer.cpp",
    "com_android_internal_os_ZygoteInit.cpp",
]

["libskia"]
provider = "none"
reason = "SkRawCodec is Skia's RAW/DNG decoder over libdng_sdk (none: its licence)"
srcs = ["src/codec/SkRawCodec.cpp"]

# AOSP's external/boringssl is the frozen FIPS branch, still under the OpenSSL licence, which the GPL-3 QEMU bridge's process cannot hold; upstream relicensed to Apache-2.0
["libcrypto"]
provider = "upstream:boringssl"
reason = "AOSP's copy is OpenSSL-licensed; upstream BoringSSL is Apache-2.0"

["libcrypto_static"]
provider = "upstream:boringssl"
reason = "AOSP's copy is OpenSSL-licensed; upstream BoringSSL is Apache-2.0. Linked as the shared libcrypto (one BoringSSL per process), where AOSP links its non-FIPS static copy into libcore's JNI libraries and dex2oat"

["libssl"]
provider = "upstream:boringssl"
reason = "AOSP's copy is OpenSSL-licensed; upstream BoringSSL is Apache-2.0"

# Rust crates whose Android code is hidden on glibc (owner decision B, 2026-11-01): built as Android userspace, see `rust_os` above
["librustutils"]
rust_os = "android"
reason = "rustutils::system_properties (crabbyavif's MediaCodec path) wraps bionic's __system_property_* API, which atl-bionic provides; its android block adds the bindgen crates it needs"

["liblog_rust"]
rust_os = "android"
reason = "AOSP's patched log crate: its android block's default_log_impl makes android_logger (logcat via liblog) the default logger; without it every log! of an uninitialised process is dropped"

["liblogger"]
rust_os = "android"
reason = "logger::init writes to logcat through android_logger on Android, to stderr through env_logger elsewhere; the app's log belongs in liblog"

["libandroid_logger"]
rust_os = "android"
reason = "android_logger, liblogger's Android backend: its __android_log_* calls are gated on target_os = \"android\", a no-op elsewhere"

# C/C++ modules compiled with macros their patch reads
["servicemanager"]
defines = ["ATL_NO_SELINUX"]
reason = "AOSP's servicemanager is the context manager (owner 2026-11-02, binder Q3); the host has no Android SELinux policy, so Access (patches/aosp/frameworks/native 0002) decides by the binder caller's uid as the non-__ANDROID__ build does, instead of aborting on selinux_status_open / getcon / getPidcon or denying every lookup without service_contexts; the uid it keeps makes ServiceManager refuse addService from app uids. Rung 4 because: as-is (1) aborts at startup; the environment (2) would have to ship an Android SELinux policy and a kernel LSM the host lacks; a substitute libselinux (3) cannot pass getPidcon's CHECK inside a transaction, which is servicemanager's own code"
