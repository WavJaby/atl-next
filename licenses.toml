# SPDX-License-Identifier: MIT
# The one licence policy: which licences may be compiled into each shipped artifact. A licence not listed
# for an artifact fails, so a new licence is a reviewed change here. `cargo xtask check` step `tables`
# checks: ids exist in the SPDX list and are not deprecated; GPL-2.0-only anywhere only `WITH` a linking exception (Classpath-exception-2.0, Linux-syscall-note); GPL-3 family in `runtime` only `WITH` an exception that frees its users (GCC-exception-3.1, Bison-exception-2.2); once `qemu-bridge` exists, `runtime` stays within it (runtime code shares the bridge's process); deny.toml's crate allow list stays within `runtime`.
#
# [artifact.<name>]
#   allow          SPDX licences, each `<id>` or `<id> WITH <exception>`; `LicenseRef-<name>` for one the SPDX list lacks
#     runtime      the ART process, atld, our libraries and everything they link
#     qemu-bridge  the dlopened QEMU bridge, distributed as GPL-3.0-or-later: licences combinable with GPL-3
# [upstream.<name>]   a sources.toml upstream (`aosp`: every AOSP project, paths relative to the tree root)
#   unlabelled     licence of its files that carry no licence header, from the upstream's LICENSE text. Not for `aosp`: an AOSP file's is derived from its Soong package, the nearest directory at or above it whose Android.bp declares a licence -- the kinds of that package's `license` modules and of every `license` module its `licenses` / `default_applicable_licenses` name, wherever defined (exactly one `SPDX-license-identifier-<id>` kind -> <id>; several kinds, none up to the project root, or an unresolvable reference -> no default)
#   [upstream.<name>.paths."<path prefix>"]   licence (SPDX expression; LicenseRef-<name> for one the SPDX list lacks) + reason, for files whose notice the phrase rules cannot read; longest prefix wins, before any tag or notice
# `xtask native`'s licence gate applies this to every source and header linked into a device artifact (all `runtime`).
# Rows are added when a compiled set first needs them.

[artifact.runtime]
# BSD-2-Clause, BSD-3-Clause, ISC, public domain: owner decision 2026-10-31; all on the FSF list of GPL-3-compatible licences, so within a future qemu-bridge list.
# LicenseRef-Public-Domain: a "placed in the public domain" notice is a dedication, not a licence, and the SPDX list has no id for it (CC0-1.0 / Unlicense are specific instruments those notices do not use).
# FTL, ICU, IJG, Libpng, libpng-2.0, MIT-Modern-Variant, Zlib: owner decision 2026-10-31, all GPL-3-compatible permissive licences (FreeType's `FTL OR GPL-2.0-or-later` passes through FTL).
# GPL-2.0-only WITH Linux-syscall-note: owner decision 2026-10-31; the note frees programs that use the kernel through system calls, i.e. include its uapi headers, so it is a linking exception in the sense of the GPL-2.0-only rule.
# LicenseRef-AGG-2.3, blessing: owner decision 2026-10-31; AGG 2.3's all-permissive notice (copy/use/modify/sell/distribute if the notice is kept; no SPDX id) and SQLite's public-domain blessing (SPDX `blessing`), both GPL-3-compatible.
# MIT-Khronos-old: owner decision 2026-10-31; Khronos' MIT-style permissive text granting rights to the "Materials", GPL-3-compatible.
# SGI-B-2.0: owner decision 2026-11-01; SGI Free Software License B 2.0, X11-style permissive, on the FSF list of GPL-compatible licences.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "blessing",
    "FTL",
    "GPL-2.0-only WITH Linux-syscall-note",
    "ICU",
    "IJG",
    "ISC",
    "LicenseRef-AGG-2.3",
    "LicenseRef-Public-Domain",
    "Libpng",
    "libpng-2.0",
    "MIT",
    "MIT-Khronos-old",
    "MIT-Modern-Variant",
    "SGI-B-2.0",
    "Unicode-3.0",
    "Zlib",
]

[upstream.aosp.paths."frameworks/native/opengl/include/GLES3/gl3ext.h"]
licence = "SGI-B-2.0"
reason = "Khronos' GLES3 extension header: \"This document is licensed under the SGI Free Software B License Version 2.0\" (lines 7-8); a pointer notice the phrase rules do not read"

