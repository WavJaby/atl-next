# SPDX-License-Identifier: MIT
# The one licence policy: which licences may be compiled into each shipped artifact. A licence not listed
# for an artifact fails, so a new licence is a reviewed change here. `cargo xtask check` step `tables`
# checks: ids exist in the SPDX list and are not deprecated; GPL-2.0-only anywhere only `WITH` a linking exception (Classpath-exception-2.0, Linux-syscall-note); GPL-3 family in `runtime` only `WITH` an exception that frees its users (GCC-exception-3.1, Bison-exception-2.2); once `qemu-bridge` exists, `runtime` stays within it (runtime code shares the bridge's process); deny.toml's crate allow list stays within `runtime`.
#
# [artifact.<name>]
#   allow          SPDX licences, each `<id>` or `<id> WITH <exception>`; `LicenseRef-<name>` for one the SPDX list lacks
#     runtime      the ART process, atld, our libraries and everything they link
#     qemu-bridge  the dlopened QEMU bridge, distributed as GPL-3.0-or-later: licences combinable with GPL-3
# [upstream.<name>]   a sources.toml upstream (`aosp`: every AOSP project, paths relative to the tree root)
#   unlabelled     licence of its files that carry no licence header, from the upstream's LICENSE text. Not for `aosp`: an AOSP file's is derived from its Soong package, the nearest directory at or above it whose Android.bp declares a licence -- the kinds of that package's `license` modules and of every `license` module its `licenses` / `default_applicable_licenses` name, wherever defined (exactly one `SPDX-license-identifier-<id>` kind -> <id>; several kinds, none up to the project root, or an unresolvable reference -> no default)
#   [upstream.<name>.paths."<path prefix>"]   licence (SPDX expression; LicenseRef-<name> for one the SPDX list lacks) + reason, for files whose notice the phrase rules cannot read; longest prefix wins, before any tag or notice
# [test_only.<module>]  an Android.bp test program (cc_test / cc_benchmark, checked against the AOSP module index) built only to test, never shipped: its device artifact is outside every [artifact.*] (CLAUDE.md: the gate's set is what reaches a shipped binary, like the NDK test fixtures). `reason`: what it tests. Its build dir may not be bound into a runtime root (atld_run refuses it).
# `xtask native`'s licence gate applies this to every source and header linked into a device artifact (all `runtime`), test-only ones aside.
# Rows are added when a compiled set first needs them.

[test_only.deqp-binary]
reason = "dEQP conformance runner (EGL/GLES ground-truth suite of the GL bridge, plan S11), run from the build dir; carries vulkancts and glslang (Bison parser) sources no runtime library links"

[artifact.runtime]
# BSD-2-Clause, BSD-3-Clause, ISC, public domain: owner decision 2026-10-31; all on the FSF list of GPL-3-compatible licences, so within a future qemu-bridge list.
# LicenseRef-Public-Domain: a "placed in the public domain" notice is a dedication, not a licence, and the SPDX list has no id for it (CC0-1.0 / Unlicense are specific instruments those notices do not use).
# FTL, ICU, IJG, Libpng, libpng-2.0, MIT-Modern-Variant, Zlib: owner decision 2026-10-31, all GPL-3-compatible permissive licences (FreeType's `FTL OR GPL-2.0-or-later` passes through FTL).
# GPL-2.0-only WITH Linux-syscall-note: owner decision 2026-10-31; the note frees programs that use the kernel through system calls, i.e. include its uapi headers, so it is a linking exception in the sense of the GPL-2.0-only rule.
# LicenseRef-AGG-2.3, blessing: owner decision 2026-10-31; AGG 2.3's all-permissive notice (copy/use/modify/sell/distribute if the notice is kept; no SPDX id) and SQLite's public-domain blessing (SPDX `blessing`), both GPL-3-compatible.
# MIT-Khronos-old: owner decision 2026-10-31; Khronos' MIT-style permissive text granting rights to the "Materials", GPL-3-compatible.
# SGI-B-2.0: owner decision 2026-11-01; SGI Free Software License B 2.0, X11-style permissive, on the FSF list of GPL-compatible licences.
# MPL-2.0: owner decision 2026-11-01 (Eigen, via libinput); file-level copyleft, and we do not modify Eigen. GPL-3-compatible through MPL-2.0 section 3.3 unless a file carries the "Incompatible With Secondary Licenses" notice, which the gate reads as MPL-2.0-no-copyleft-exception, not allowed.
# GPL-2.0-only WITH Classpath-exception-2.0: owner decision 2026-10-29 (libcore ojluni natives, libjdwp); the exception permits linking with independent modules of any licence, so it is a linking exception in the sense of the GPL-2.0-only rule. Listed when the converter first linked libcore (2026-11-02).
# SunPro: owner decision 2026-11-02 (fdlibm, via libcore's libfdlibm); Sun's all-permissive notice (use, copy, modify, distribute if the notice is kept), GPL-3-compatible.
# Apache-2.0 WITH LLVM-exception: owner decision 2026-11-06 (llvm-project runtimes libc++/libc++abi/libunwind/compiler-rt builtins for the bionic targets, and 2026-11-07 the host LLVM of llvm_host.rs: llvm-project's LICENSE.TXT); the exception only removes Apache-2.0 attribution duties for compiled-in runtime code, so it stays GPL-3-compatible as Apache-2.0 is.
# BSL-1.0, HPND-sell-variant: accepted 2026-11-06 (Mesa: c11 threads emulation, loader_dri_helper); both permissive and on the FSF list of GPL-compatible licences.
# TU-Berlin-2.0: accepted 2026-11-07 (libgsm, via the GSM soft decoder the Codec2 store lists); all-permissive (use/copy/modify/distribute for any purpose if the notice is kept), the same class as LicenseRef-AGG-2.3, GPL-3-compatible.
# CC0-1.0, NCSA: owner decision 2026-11-07, for the host LLVM build (llvm_host.rs, plan llvmpipe S1): BLAKE3 (llvm/lib/Support/BLAKE3, `SPDX-License-Identifier: CC0-1.0`, a public-domain dedication, the class of LicenseRef-Public-Domain but a named instrument) and LLVM's legacy University-of-Illinois header (llvm/lib/TargetParser/CSKYTargetParser.cpp). Both permissive and on the FSF list of GPL-compatible licences.
# GPL-1.0-or-later WITH Linux-syscall-note: owner decision 2026-11-08, following the 2026-10-31 syscall-note decision (Mesa's copy of the kernel uapi sync_file.h, pulled in by iris); "or later" makes it GPL-3-compatible, and the note frees uapi-header users as above.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "blessing",
    "BSL-1.0",
    "CC0-1.0",
    "FTL",
    "GPL-1.0-or-later WITH Linux-syscall-note",
    "GPL-2.0-only WITH Classpath-exception-2.0",
    "GPL-2.0-only WITH Linux-syscall-note",
    "HPND-sell-variant",
    "ICU",
    "IJG",
    "ISC",
    "LicenseRef-AGG-2.3",
    "LicenseRef-Public-Domain",
    "Libpng",
    "libpng-2.0",
    "MIT",
    "MIT-Khronos-old",
    "MIT-Modern-Variant",
    "MPL-2.0",
    "NCSA",
    "SGI-B-2.0",
    "SunPro",
    "TU-Berlin-2.0",
    "Unicode-3.0",
    "Zlib",
]

