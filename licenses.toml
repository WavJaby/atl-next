# SPDX-License-Identifier: MIT
# The one licence policy: which licences may be compiled into each shipped artifact. A licence not listed
# for an artifact fails, so a new licence is a reviewed change here. `cargo xtask check` step `tables`
# checks: ids exist in the SPDX list and are not deprecated; no bare GPL-2.0-only anywhere (only as an
# explicit `GPL-2.0-only WITH <exception>` entry); GPL-3 family in `runtime` only `WITH` an exception that
# frees its users (GCC runtime, Bison); once `qemu-bridge` exists, `runtime` stays within it (runtime code
# shares the bridge's process); deny.toml's crate allow list stays within `runtime`.
#
# [artifact.<name>]
#   allow          SPDX licences, each `<id>` or `<id> WITH <exception>`
#     runtime      the ART process, atld, our libraries and everything they link
#     qemu-bridge  the dlopened QEMU bridge, distributed as GPL-3.0-or-later: licences combinable with GPL-3
# [upstream.<name>]   a sources.toml upstream (`aosp`: every AOSP project, paths relative to the tree root)
#   unlabelled     licence of its files that carry no licence header, from the upstream's LICENSE text. Not for `aosp`: an AOSP project's is derived from its Android.bp `license` modules (exactly one `SPDX-license-identifier-<id>` kind -> <id>; several kinds, or none, -> no default)
#   [upstream.<name>.paths."<path prefix>"]   licence (SPDX expression; LicenseRef-<name> for one the SPDX list lacks) + reason, for files whose notice the phrase rules cannot read; longest prefix wins, before any tag or notice
# `xtask native`'s licence gate applies this to every source and header linked into a device artifact (all `runtime`).
# Rows are added when a compiled set first needs them.

[artifact.runtime]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]

[upstream.aosp.paths."external/dng_sdk/"]
licence = "LicenseRef-Adobe-DNG-SDK"
reason = "Adobe's DNG SDK Licence Agreement with its DNG patent licence (PATENTS: rights granted \"solely to permit the reading and writing of image files that comply with the DNG Specification\"): a field-of-use restriction GPL-3 forbids, so never allowed where the GPL-3 QEMU bridge may load; the file headers only point at the agreement, which the phrase rules do not read"

[upstream.aosp.paths."external/skia/android/include/config/SkUserConfig.h"]
licence = "BSD-3-Clause"
reason = "generated by Skia's gn_to_bp.py, no notice; Skia's LICENSE is BSD-3-Clause, and its Android.bp lists several licence kinds, so the project has no default"

[upstream.boringssl]
# BoringSSL's LICENSE is the Apache License 2.0; its one other licence (Go's, "parts of the TLS test suite") covers ssl/test/runner, which libcrypto/libssl never compile.
# Header-less files (gen/ perlasm output, third_party/fiat, a few internal headers) fall under it.
unlabelled = "Apache-2.0"

[upstream.boringssl.paths."crypto/chacha/chacha.cc"]
licence = "Apache-2.0"
reason = "Apache-2.0 header; the added note that it is adapted from public-domain eSTREAM code is not a licence notice the phrase rules accept"

[upstream.boringssl.paths."crypto/curve25519/"]
licence = "Apache-2.0"
reason = "Apache-2.0 header; the added note that parts come from public-domain SUPERCOP ref10 is not a licence notice the phrase rules accept"

[upstream.boringssl.paths."crypto/poly1305/"]
licence = "Apache-2.0"
reason = "Apache-2.0 header; the added note that poly1305-donna is public domain is not a licence notice the phrase rules accept"

[upstream.qemu]
# QEMU's LICENSE: "Source files with no licensing information are released under the GNU General
# Public License, version 2 or (at your option) any later version."
unlabelled = "GPL-2.0-or-later"
