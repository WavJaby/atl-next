# SPDX-License-Identifier: MIT
# Stable options only. rustfmt leaves comments unwrapped by default (`wrap_comments` is nightly), which
# matches the no-column-wrap rule; `max_width` applies to code only.
edition = "2024"
style_edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
